<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>오늘의 운세 알 깨기 🥚</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
            background: #0f0c29;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        /* Egg Shake Animation on Click */
        @keyframes eggShake {
            0% { transform: rotate(0deg) scale(1); }
            20% { transform: rotate(-12deg) scale(1.05); }
            40% { transform: rotate(12deg) scale(1.05); }
            60% { transform: rotate(-8deg) scale(1.02); }
            80% { transform: rotate(8deg) scale(1.02); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .animate-shake {
            animation: eggShake 0.4s ease-in-out;
        }

        /* Float Idle Animation */
        @keyframes floatEgg {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
        }
        .animate-float {
            animation: floatEgg 3s ease-in-out infinite;
        }

        /* Energy Drain Screen Flash Effect */
        @keyframes drainPulse {
            0% { background-color: rgba(239, 68, 68, 0); }
            50% { background-color: rgba(220, 38, 38, 0.35); }
            100% { background-color: rgba(239, 68, 68, 0); }
        }
        .drain-active {
            animation: drainPulse 0.5s ease-in-out forwards;
        }

        /* Glow effects */
        .glow-gold { filter: drop-shadow(0 0 20px rgba(250, 204, 21, 0.8)); }
        .glow-red { filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.8)); }
        .glow-egg { filter: drop-shadow(0 15px 25px rgba(251, 191, 36, 0.3)); }

        /* Custom Rain animation for bad fortune */
        @keyframes rainDrop {
            0% { transform: translateY(-20px); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
        .rain-drop {
            position: absolute;
            background: rgba(148, 163, 184, 0.6);
            width: 2px;
            height: 18px;
            animation: rainDrop 0.8s linear infinite;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 min-h-screen relative overflow-hidden">

    <!-- Rain / Drain Particle Container Overlay -->
    <div id="effectOverlay" class="fixed inset-0 pointer-events-none z-0"></div>

    <header class="w-full max-w-md z-10 text-center pt-4">
        <div class="inline-flex items-center gap-2 bg-amber-500/20 border border-amber-400/30 px-4 py-1.5 rounded-full text-amber-300 text-xs sm:text-sm font-bold shadow-lg mb-2">
            <span class="animate-pulse">✨</span> 오늘의 운세 측정소 <span class="animate-pulse">✨</span>
        </div>
        <h1 class="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-500 tracking-wide">
            운세의 알 🥚
        </h1>
        <p class="text-slate-300 text-xs sm:text-sm mt-1">
            하루에 단 한 번! 알을 <span class="text-amber-400 font-bold">3번</span> 눌러 운세를 확인하세요.
        </p>
    </header>

    <main class="w-full max-w-md my-auto flex flex-col items-center justify-center z-10 py-6">
        
        <!-- Glass Status Card -->
        <div class="glass-panel w-full rounded-3xl p-6 flex flex-col items-center text-center relative overflow-hidden border-amber-400/20">
            
            <!-- Date & Daily Status Badge -->
            <div class="flex items-center justify-between w-full mb-4 text-xs">
                <span id="currentDateText" class="text-slate-400 font-mono">2026-09-30</span>
                <span id="dailyStatusBadge" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full font-bold">
                    기회 있음 (1/1)
                </span>
            </div>

            <!-- EGG INTERACTIVE AREA -->
            <div id="eggContainer" onclick="handleEggClick()" class="relative cursor-pointer my-6 group transition transform active:scale-95 select-none">
                
                <!-- Egg SVG Graphic -->
                <div id="eggGraphic" class="relative w-48 h-60 sm:w-56 sm:h-68 animate-float transition duration-300">
                    <svg viewBox="0 0 200 260" class="w-full h-full glow-egg">
                        <defs>
                            <!-- Egg Base Radial Gradient -->
                            <radialGradient id="eggGrad" cx="35%" cy="30%" r="70%">
                                <stop offset="0%" stop-color="#fffbeb"/>
                                <stop offset="50%" stop-color="#fde68a"/>
                                <stop offset="85%" stop-color="#f59e0b"/>
                                <stop offset="100%" stop-color="#d97706"/>
                            </radialGradient>
                            <!-- Inner Shadow -->
                            <filter id="shadow">
                                <feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity="0.3"/>
                            </filter>
                        </defs>
                        
                        <!-- Egg Outer Shape -->
                        <path d="M 100,10 C 155,10 190,80 190,165 C 190,220 150,250 100,250 C 50,250 10,220 10,165 C 10,80 45,10 100,10 Z" 
                              fill="url(#eggGrad)" filter="url(#shadow)"/>
                        
                        <!-- Egg Light Highlight -->
                        <path d="M 70,30 C 90,20 110,20 100,45 C 80,45 60,60 50,85 C 45,70 55,40 70,30 Z" 
                              fill="white" opacity="0.4"/>

                        <!-- Crack Stage 1 (Hidden by default) -->
                        <path id="crackLine1" d="M 95,80 L 110,100 L 90,120 L 105,140" 
                              stroke="#78350f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0"/>

                        <!-- Crack Stage 2 (Hidden by default) -->
                        <path id="crackLine2" d="M 105,140 L 130,150 L 115,175 L 140,190 M 90,120 L 65,135 L 80,155" 
                              stroke="#78350f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0"/>
                    </svg>

                    <!-- Egg Glow Effect Ring -->
                    <div id="eggAura" class="absolute inset-0 bg-amber-400/20 rounded-full blur-2xl -z-10 transition opacity-0"></div>
                </div>

                <!-- Touch Counter Indicator -->
                <div id="clickCounterBadge" class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-slate-900/90 border border-amber-400/50 text-amber-300 text-xs sm:text-sm font-bold px-4 py-1.5 rounded-full shadow-lg">
                    알을 터치하세요! (<span id="clicksLeftText" class="text-amber-400 font-extrabold text-base">3</span>회 남음)
                </div>
            </div>

            <div id="resultContainer" class="hidden flex-col items-center animate-fade-in space-y-3 w-full pt-2">
                
                <!-- Huge Icon (👍 or 👎) -->
                <div id="resultIcon" class="text-7xl sm:text-8xl transition transform scale-110">
                    👍
                </div>

                <!-- Result Title -->
                <div id="resultTitle" class="text-2xl sm:text-3xl font-extrabold">
                    따봉! 최고의 운세!
                </div>

                <!-- Result Description -->
                <div id="resultDesc" class="text-slate-200 text-sm font-sans-kr bg-slate-900/60 p-4 rounded-2xl border border-white/10 w-full leading-relaxed">
                    오늘 하루는 무슨 일을 해도 술술 풀리는 대운의 날입니다! 마음껏 도전하세요!
                </div>
            </div>

            <div id="drainWarningBox" class="hidden w-full bg-rose-950/80 border-2 border-rose-500/60 rounded-2xl p-4 text-center space-y-2 mt-2 animate-bounce">
                <div class="text-rose-400 font-bold text-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-skull-crossbones"></i> <span>기가 빨리고 있습니다!</span> <i class="fa-solid fa-skull-crossbones"></i>
                </div>
                <p class="text-rose-200 text-xs font-sans-kr">
                    이미 오늘의 운세를 확인했습니다!<br>
                    지나친 탐욕으로 인해 <strong class="text-amber-300">생명 에너지(기)</strong>가 흡수되는 중입니다! 😱
                </p>
                <div id="drainCountText" class="text-[11px] text-rose-300 font-mono">
                    흡수된 기: -10 HP
                </div>
            </div>

        </div>
    </main>

    <footer class="w-full max-w-md z-10 text-center pb-2">
        <div class="flex items-center justify-between text-slate-400 text-xs px-2">
            <span>⚠️️ 하루 1회 제한 (자정 초기화)</span>
            <button onclick="resetTodayData()" class="hover:text-amber-300 underline transition">
                🔄 [테스트] 오늘 기록 초기화
            </button>
        </div>
    </footer>

    <script>
        /* ===================================================================
         * WEB AUDIO API SYNTHESIZER (No external audio files needed)
         * =================================================================== */
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Sound 1: Egg Tap / Crack
        function playEggTapSound(pitch = 1.0) {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300 * pitch, now);
                osc.frequency.exponentialRampToValueAtTime(120 * pitch, now + 0.1);

                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.1);
            } catch(e){}
        }

        // Sound 2: Success Fanfare (Thumbs Up 👍)
        function playSuccessSound() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6

                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.1);

                    gain.gain.setValueAtTime(0.3, now + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.3);
                });
            } catch(e){}
        }

        // Sound 3: Unlucky Gloomy Sound (Thumbs Down 👎)
        function playGloomySound() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const notes = [400, 360, 320, 250]; // Descending sad tone

                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.15);

                    gain.gain.setValueAtTime(0.25, now + idx * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.15 + 0.25);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now + idx * 0.15);
                    osc.stop(now + idx * 0.15 + 0.25);
                });
            } catch(e){}
        }

        // Sound 4: Energy Drain Scary Buzz Sound
        function playDrainSound() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.4);

                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.4);
            } catch(e){}
        }

        /* ===================================================================
         * GAME STATE & DAILY LOGIC
         * =================================================================== */
        let clickCount = 0;
        let isDoneToday = false;
        let drainClicks = 0;
        const TODAY_KEY = new Date().toISOString().split('T')[0]; // Format: YYYY-MM-DD

        // Fortune Data Templates
        const LUCKY_FORTUNES = [
            { title: "대길(大吉) 따봉!", desc: "오늘 하루는 엄청난 행운이 함께합니다! 모든 일이 뜻대로 이루어지는 기적 같은 날이 될 거예요. 👍" },
            { title: "운수대통 따봉!", desc: "뜻밖의 기분 좋은 소식이나 선물을 받을 수 있습니다. 미소를 머금고 즐겁게 하루를 시작하세요! 🍀" },
            { title: "초집중 따봉!", desc: "두뇌 회전과 집중력이 최고조에 달합니다. 미뤄뒀던 공부나 일을 깔끔하게 해결해 보세요! 💡" }
        ];

        const UNLUCKY_FORTUNES = [
            { title: "우우우~ 조심의 날!", desc: "오늘은 무리하게 고집을 부리면 손해를 볼 수 있습니다. 조심조심 신중하게 행동하세요! 👎" },
            { title: "우우우~ 방심 금지!", desc: "작은 실수가 생기기 쉬운 날입니다. 소지품을 잘 챙기고 차분함을 유지하세요! ☔" },
            { title: "우우우~ 휴식 필요!", desc: "에너지가 다소 떨어질 수 있습니다. 무리하지 말고 자기 자신에게 달콤한 휴식을 선물하세요! 🍵" }
        ];

        /* ===================================================================
         * INITIALIZATION & LOCALSTORAGE CHECK
         * =================================================================== */
        window.onload = function() {
            document.getElementById('currentDateText').innerText = TODAY_KEY;
            checkDailyStatus();
        };

        function checkDailyStatus() {
            const savedData = localStorage.getItem('study_egg_fortune_' + TODAY_KEY);

            if (savedData) {
                // Already completed today!
                const parsed = JSON.parse(savedData);
                isDoneToday = true;
                clickCount = 3;

                // Update HUD
                document.getElementById('dailyStatusBadge').className = 
                    "bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-1 rounded-full font-bold";
                document.getElementById('dailyStatusBadge').innerText = "오늘 기회 사용함 (0/1)";
                document.getElementById('clicksLeftText').innerText = "0";
                document.getElementById('clickCounterBadge').innerText = "오늘의 운세 확인 완료!";

                // Reveal saved cracks & result
                document.getElementById('crackLine1').style.opacity = "1";
                document.getElementById('crackLine2').style.opacity = "1";
                showResultUI(parsed.isLucky, parsed.fortune);
            }
        }

        /* ===================================================================
         * MAIN EGG INTERACTION HANDLER
         * =================================================================== */
        function handleEggClick() {
            const eggGraphic = document.getElementById('eggGraphic');

            // 1. IF ALREADY DONE TODAY -> TRIGGER ENERGY DRAIN PENALTY
            if (isDoneToday) {
                triggerEnergyDrain();
                return;
            }

            // 2. NORMAL CLICK LOGIC (Click 1, 2, 3)
            clickCount++;
            playEggTapSound(1.0 + (clickCount * 0.2));

            // Trigger Shake Animation
            eggGraphic.classList.remove('animate-shake');
            void eggGraphic.offsetWidth; // Trigger reflow
            eggGraphic.classList.add('animate-shake');

            // Update Crack Stages & Counter
            const remaining = 3 - clickCount;
            document.getElementById('clicksLeftText').innerText = remaining;

            if (clickCount === 1) {
                document.getElementById('crackLine1').style.opacity = "1";
            } else if (clickCount === 2) {
                document.getElementById('crackLine2').style.opacity = "1";
            } else if (clickCount >= 3) {
                // EGG HATCH / BREAK!
                breakEggAndRevealFortune();
            }
        }

        /* ===================================================================
         * EGG BREAKING & FORTUNE DECISION
         * =================================================================== */
        function breakEggAndRevealFortune() {
            isDoneToday = true;

            // 50% Random Chance for 👍 (Lucky) or 👎 (Unlucky)
            const isLucky = Math.random() >= 0.5;
            const fortuneList = isLucky ? LUCKY_FORTUNES : UNLUCKY_FORTUNES;
            const chosenFortune = fortuneList[Math.floor(Math.random() * fortuneList.length)];

            // Save to LocalStorage
            localStorage.setItem('study_egg_fortune_' + TODAY_KEY, JSON.stringify({
                isLucky: isLucky,
                fortune: chosenFortune
            }));

            // Update Badge
            document.getElementById('dailyStatusBadge').className = 
                "bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-1 rounded-full font-bold";
            document.getElementById('dailyStatusBadge').innerText = "오늘 기회 사용함 (0/1)";
            document.getElementById('clickCounterBadge').innerText = "축하합니다! 알이 깨졌습니다!";

            // Reveal Result with delay for dramatic effect
            setTimeout(() => {
                showResultUI(isLucky, chosenFortune);
            }, 300);
        }

        /* ===================================================================
         * RESULT UI & EFFECTS RENDER
         * =================================================================== */
        function showResultUI(isLucky, fortune) {
            const resultBox = document.getElementById('resultContainer');
            const resultIcon = document.getElementById('resultIcon');
            const resultTitle = document.getElementById('resultTitle');
            const resultDesc = document.getElementById('resultDesc');
            const aura = document.getElementById('eggAura');

            resultBox.classList.remove('hidden');
            resultBox.classList.add('flex');

            if (isLucky) {
                // 👍 THUMBS UP - LUCKY DAY
                playSuccessSound();
                resultIcon.innerText = "👍";
                resultIcon.className = "text-7xl sm:text-8xl transition transform scale-110 glow-gold animate-bounce";
                resultTitle.innerText = fortune.title;
                resultTitle.className = "text-2xl sm:text-3xl font-extrabold text-amber-300";
                resultDesc.innerText = fortune.desc;
                aura.className = "absolute inset-0 bg-amber-400/30 rounded-full blur-2xl -z-10 opacity-100";

                // Confetti Explosion
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 80,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }
            } else {
                // 👎 THUMBS DOWN - UNLUCKY DAY
                playGloomySound();
                resultIcon.innerText = "👎";
                resultIcon.className = "text-7xl sm:text-8xl transition transform scale-110 glow-red";
                resultTitle.innerText = fortune.title;
                resultTitle.className = "text-2xl sm:text-3xl font-extrabold text-slate-300";
                resultDesc.innerText = fortune.desc;
                aura.className = "absolute inset-0 bg-indigo-600/30 rounded-full blur-2xl -z-10 opacity-100";

                // Create Rain Overlay
                spawnRainEffect();
            }
        }

        /* ===================================================================
         * ENERGY DRAIN PENALTY (Clicked 2+ times on same day)
         * =================================================================== */
        function triggerEnergyDrain() {
            drainClicks++;
            playDrainSound();

            // Screen Shake & Red Flash
            document.body.classList.remove('drain-active');
            void document.body.offsetWidth;
            document.body.classList.add('drain-active');

            const eggGraphic = document.getElementById('eggGraphic');
            eggGraphic.classList.remove('animate-shake');
            void eggGraphic.offsetWidth;
            eggGraphic.classList.add('animate-shake');

            // Show Warning Box
            const warningBox = document.getElementById('drainWarningBox');
            warningBox.classList.remove('hidden');
            document.getElementById('drainCountText').innerText = `누적 빼앗긴 기: -${drainClicks * 15} HP 👻`;

            // Particle Dark Aura
            spawnDrainParticles();
        }

        function spawnDrainParticles() {
            const overlay = document.getElementById('effectOverlay');
            for (let i = 0; i < 5; i++) {
                const p = document.createElement('div');
                p.innerText = "👻";
                p.className = "absolute text-2xl animate-ping pointer-events-none";
                p.style.left = Math.random() * 80 + 10 + "%";
                p.style.top = Math.random() * 80 + 10 + "%";
                overlay.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
        }

        function spawnRainEffect() {
            const overlay = document.getElementById('effectOverlay');
            overlay.innerHTML = "";
            for (let i = 0; i < 30; i++) {
                const drop = document.createElement('div');
                drop.className = "rain-drop";
                drop.style.left = Math.random() * 100 + "%";
                drop.style.animationDelay = Math.random() * 0.8 + "s";
                drop.style.animationDuration = (0.5 + Math.random() * 0.5) + "s";
                overlay.appendChild(drop);
            }
        }

        /* ===================================================================
         * TESTING RESET UTILITY
         * =================================================================== */
        function resetTodayData() {
            localStorage.removeItem('study_egg_fortune_' + TODAY_KEY);
            location.reload();
        }
    </script>
</body>
</html>
