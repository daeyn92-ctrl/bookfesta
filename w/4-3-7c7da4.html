<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>말랑이 말랑해 - 귀여운 말랑이 만지기 & ASMR</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for cute typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        gaegu: ['Gaegu', 'cursive'],
                        gowun: ['Gowun Dodum', 'sans-serif']

                        mallangPink: '#ffb3c6',

    </script>

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Gowun Dodum', sans-serif;
            background: linear-gradient(135deg, #ffe5ec 0%, #f0ef3f20 50%, #e7c6ff 100%);
            color: #4a3e3d;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .title-font {
            font-family: 'Gaegu', cursive;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);

        .mallang-card {
            transition: all 0.25s ease;

        .mallang-card.active {
            border-color: #ff85a2;
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 8px 20px rgba(255, 133, 162, 0.4);
        }

        canvas {
            touch-action: none;
            cursor: pointer;
        }

        /* Bubble Floater Animation */
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.2); opacity: 0; }
        }

        .float-particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }
    </style>
</head>
<body class="m-0 p-0 flex justify-center items-center">

    <script>
        /* =========================================================================
         * Web Audio Synthesizer for ASMR Squish & Crunch Sound Effects
         * ========================================================================= */
        class MallangSoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Squish sound (Elastic Pitch Sweep)
            playSquishSound(intensity = 1.0) {
                if (this.muted) return;
                this.init();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                // Pitch drops down fast then rebounds
                osc.frequency.setValueAtTime(280 * intensity, now);
                osc.frequency.exponentialRampToValueAtTime(120 * intensity, now + 0.08);
                osc.frequency.exponentialRampToValueAtTime(220 * intensity, now + 0.18);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }

            // Crunch sound (Bead crackle / Crisp noise)
            playCrunchSound() {
                if (this.muted) return;
                this.init();

                const now = this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * 0.1;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);

                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(2500 + Math.random() * 1000, now);
                filter.Q.value = 3;

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);
            }

            // Sherbet sound (Soft rustle + gentle chime)
            playSherbetSound() {
                if (this.muted) return;
                this.init();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800 + Math.random() * 400, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.12);

                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            }

            // Boba Pop Sound
            playPopSound() {
                if (this.muted) return;
                this.init();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.05);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        const audio = new MallangSoundEngine();

        function toggleSound() {
            audio.muted = !audio.muted;
            const icon = document.getElementById('sound-icon');
            if (audio.muted) {
                icon.className = 'fa-solid fa-volume-xmark text-gray-400';
            } else {
                icon.className = 'fa-solid fa-volume-high text-pink-500';
                audio.playSquishSound(1.0);
            }
        }

        /* =========================================================================
         * STREAMING_CHUNK:Defining Mallang-i Preset Types and Physics Engine...
         * ========================================================================= */
        const MALLANG_TYPES = [
            {
                id: 'sherbet',
                name: '🍧 샤베트 말랑이',
                desc: '사각사각 시원한 얼음 알갱이가 들어있는 샤베트!',
                colorStart: '#a8edd9',
                colorEnd: '#fed6e3',
                texture: 'sherbet',
                face: 'happy',
                stiffness: 0.12,
                particlesCount: 25,
                icon: '🍧'
            },
            {
                id: 'crunch',
                name: '🍬 크런치 말랑이',
                desc: '와삭와삭 알록달록 크런치 구슬이 톡톡!',
                colorStart: '#ffb3c6',
                colorEnd: '#ff85a2',
                texture: 'crunch',
                face: 'cute',
                stiffness: 0.18,
                particlesCount: 30,
                icon: '🍬'
            },
            {
                id: 'galaxy',
                name: '🌌 코스믹 은하 말랑이',
                desc: '반짝이는 밤하늘 별가루를 삼킨 몽환적 말랑이',
                colorStart: '#3a1c71',
                colorEnd: '#d76d77',
                texture: 'galaxy',
                face: 'wink',
                stiffness: 0.1,
                particlesCount: 35,
                icon: '🌌'
            },
            {
                id: 'boba',
                name: '🧋 버블티 말랑이',
                desc: '쫀득한 타피오카 펄이 통통 튀는 버블티',
                colorStart: '#e6ccb2',
                colorEnd: '#b08968',
                texture: 'boba',
                face: 'derp',
                stiffness: 0.15,
                particlesCount: 12,
                icon: '🧋'
            },
            {
                id: 'honey',
                name: '🍯 쫀득 꿀 말랑이',
                desc: '달콤함이 늘어나는 무지갯빛 슬라임 꿀 말랑이',
                colorStart: '#ffe5ec',
                colorEnd: '#ffb703',
                texture: 'honey',
                face: 'cat',
                stiffness: 0.08,
                particlesCount: 15,
                icon: '🍯'
            }
        ];

        let currentMallang = { ...MALLANG_TYPES[0] };
        let squishCount = 0;

        /* Canvas Elastic Mesh Variables */
        const canvas = document.getElementById('mallangCanvas');
        const ctx = canvas.getContext('2d');

        let canvasWidth, canvasHeight;
        let centerX, centerY;
        let radius = 110;

        // Radial Mesh Nodes for Jelly physics simulation
        const NUM_POINTS = 24;
        let points = [];
        let particles = [];

        // Interaction State
        let isDragging = false;
        let dragPointIndex = -1;
        let touchX = 0, touchY = 0;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvasWidth = canvas.width = rect.width;
            canvasHeight = canvas.height = rect.height;
            centerX = canvasWidth / 2;
            centerY = canvasHeight / 2;
            initMesh();
        }

        window.addEventListener('resize', resizeCanvas);

        // Initialize spring mesh around perimeter
        function initMesh() {
            points = [];
            for (let i = 0; i < NUM_POINTS; i++) {
                const angle = (i / NUM_POINTS) * Math.PI * 2;
                const bx = centerX + Math.cos(angle) * radius;
                const by = centerY + Math.sin(angle) * radius;
                points.push({
                    baseAngle: angle,
                    x: bx,
                    y: by,
                    bx: bx,
                    by: by,
                    vx: 0,
                    vy: 0
                });
            }
            initParticles();
        }

        // Initialize inner particles (crunch beads, sherbet crystals, galaxy stars, boba pearls)
        function initParticles() {
            particles = [];
            const count = currentMallang.particlesCount || 20;

            for (let i = 0; i < count; i++) {
                const r = Math.random() * (radius * 0.75);
                const angle = Math.random() * Math.PI * 2;
                particles.push({
                    x: centerX + Math.cos(angle) * r,
                    y: centerY + Math.sin(angle) * r,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5,
                    size: currentMallang.texture === 'boba' ? 8 + Math.random() * 4 : 3 + Math.random() * 5,
                    color: getParticleColor(currentMallang.texture),
                    angle: Math.random() * Math.PI * 2
                });
            }
        }

        function getParticleColor(texture) {
            if (texture === 'crunch') {
                const colors = ['#ff4d6d', '#ffb703', '#38b000', '#4ea8de', '#7209b7'];
                return colors[Math.floor(Math.random() * colors.length)];
            } else if (texture === 'sherbet') {
                return 'rgba(255, 255, 255, 0.85)';
            } else if (texture === 'galaxy') {
                return Math.random() > 0.5 ? '#ffd166' : '#ffffff';
            } else if (texture === 'boba') {
                return '#2b1e1a';
            } else if (texture === 'honey') {
                return '#ffb703';
            }
            return 'rgba(255, 255, 255, 0.6)';
        }

        /* =========================================================================
         * STREAMING_CHUNK:Implementing Physics Physics Render Loop & Touch Events...
         * ========================================================================= */
        function updatePhysics() {
            const k = currentMallang.stiffness || 0.12; // Spring constant stiffness
            const damp = 0.82; // Velocity damping factor

            // Update Spring Points
            for (let i = 0; i < NUM_POINTS; i++) {
                const p = points[i];

                // Spring force returning to base shape
                const fx = (p.bx - p.x) * k;
                const fy = (p.by - p.y) * k;

                p.vx = (p.vx + fx) * damp;
                p.vy = (p.vy + fy) * damp;

                p.x += p.vx;
                p.y += p.vy;
            }

            // Handle Drag Interaction Deformation
            if (isDragging) {
                // Deform nearby points toward touch position
                for (let i = 0; i < NUM_POINTS; i++) {
                    const p = points[i];
                    const dx = touchX - p.x;
                    const dy = touchY - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < radius * 1.2) {
                        const pull = (1 - dist / (radius * 1.2)) * 0.35;
                        p.vx += (touchX - p.x) * pull;
                        p.vy += (touchY - p.y) * pull;
                    }
                }
            }

            // Update Inner Particles inside container
            particles.forEach(pt => {
                pt.x += pt.vx;
                pt.y += pt.vy;

                // Keep particles bounded within center radius
                const dx = pt.x - centerX;
                const dy = pt.y - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > radius * 0.75) {
                    pt.vx *= -0.8;
                    pt.vy *= -0.8;
                    pt.x = centerX + (dx / dist) * (radius * 0.72);
                    pt.y = centerY + (dy / dist) * (radius * 0.72);
                }
            });
        }

        function renderMallang() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            // 1. Draw Outer Soft Shadow
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y + 12);
            for (let i = 1; i < NUM_POINTS; i++) {
                const nextP = points[(i + 1) % NUM_POINTS];
                const xc = (points[i].x + nextP.x) / 2;
                const yc = (points[i].y + nextP.y) / 2 + 12;
