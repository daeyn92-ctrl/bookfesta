<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>숏츠 톡 - Shorts Talk</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap');
    
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Custom scrollbar hiding for smooth feed scrolling */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Keyframe animation for floating hearts */
    @keyframes floatHeart {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
      }
      50% {
        opacity: 0.9;
        transform: translate(-50%, -120%) scale(1.3) rotate(-15deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -200%) scale(1.6) rotate(15deg);
      }
    }

    .animate-float-heart {
      animation: floatHeart 0.8s ease-out forwards;
    }

    /* Spinning record animation */
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animate-record-spin {
      animation: spinSlow 5s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-950 min-h-screen text-white flex justify-center items-center p-0 sm:p-4">

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-6 z-50 bg-neutral-900/90 text-white text-sm px-4 py-2.5 rounded-full shadow-2xl border border-neutral-700/60 backdrop-blur-md hidden transition-all duration-300 flex items-center space-x-2">
    <i data-lucide="sparkles" class="w-4 h-4 text-pink-400"></i>
    <span id="toast-message">알림 메시지</span>
  </div>

  <!-- Mobile Device Outer Frame Container -->
  <div class="relative w-full max-w-md h-[100vh] sm:h-[840px] bg-black sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col border border-neutral-800">

    <!-- TOP HEADER NAVBAR (Visible in Home Feed) -->
    <header id="top-header" class="absolute top-0 left-0 right-0 z-30 flex justify-between items-center px-4 py-3 bg-gradient-to-b from-black/80 via-black/40 to-transparent">
      <!-- App Brand Logo -->
      <div class="flex items-center space-x-1.5 cursor-pointer" onclick="switchTab('home')">
        <div class="bg-gradient-to-tr from-pink-500 to-rose-600 p-1.5 rounded-xl shadow-lg shadow-pink-500/30 flex items-center justify-center">
          <i data-lucide="flame" class="w-4 h-4 text-white fill-white"></i>
        </div>
        <span class="font-extrabold text-lg tracking-wider bg-gradient-to-r from-white via-neutral-200 to-pink-200 bg-clip-text text-transparent">
          숏츠 톡
        </span>
      </div>

      <!-- Feed Switcher Tabs -->
      <div class="flex items-center space-x-4 text-sm font-bold">
        <button id="tab-following" onclick="setFeedType('following')" class="text-neutral-400 transition-all">
          팔로잉
        </button>
        <button id="tab-recommend" onclick="setFeedType('recommend')" class="text-white border-b-2 border-pink-500 pb-0.5 transition-all">
          추천
        </button>
      </div>

      <!-- Audio Mute / Unmute Button -->
      <button id="mute-btn" onclick="toggleMute()" class="p-2 rounded-full bg-black/40 backdrop-blur-md hover:bg-black/60 transition-colors">
        <i data-lucide="volume-x" id="mute-icon" class="w-5 h-5 text-neutral-300"></i>
      </button>
    </header>

    <!-- MAIN DISPLAY CANVAS / FEED VIEW AREA -->
    <main class="flex-1 relative overflow-hidden bg-black">

      <!-- TAB 1: HOME VIDEO FEED -->
      <section id="view-home" class="w-full h-full overflow-y-scroll snap-y snap-mandatory no-scrollbar" style="scroll-behavior: smooth;">
        <!-- Dynamic video elements injected by JS -->
      </section>

      <!-- TAB 2: SEARCH / DISCOVER TAB -->
      <section id="view-search" class="w-full h-full bg-neutral-950 p-4 overflow-y-auto space-y-5 hidden">
        <div class="sticky top-0 bg-neutral-950 pt-2 pb-3 z-10">
          <div class="relative">
            <i data-lucide="search" class="absolute left-3.5 top-3 w-4 h-4 text-neutral-400"></i>
            <input
              type="text"
              placeholder="트렌드, 챌린지, 크리에이터 검색..."
              class="w-full bg-neutral-900 border border-neutral-800 rounded-2xl py-2.5 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-pink-500 transition-colors"
            />
          </div>
        </div>

        <!-- Trending Topics -->
        <div>
          <h3 class="text-sm font-bold text-neutral-400 mb-3 flex items-center space-x-1">
            <i data-lucide="flame" class="w-4 h-4 text-pink-500"></i>
            <span>실시간 인기 해시태그</span>
          </h3>
          <div class="flex flex-wrap gap-2">
            <span class="bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 px-3 py-1.5 rounded-full text-xs font-medium text-pink-300 cursor-pointer">#숏츠톡챌린지</span>
            <span class="bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 px-3 py-1.5 rounded-full text-xs font-medium text-pink-300 cursor-pointer">#오늘의코디</span>
            <span class="bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 px-3 py-1.5 rounded-full text-xs font-medium text-pink-300 cursor-pointer">#먹방</span>
            <span class="bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 px-3 py-1.5 rounded-full text-xs font-medium text-pink-300 cursor-pointer">#댄스커버</span>
            <span class="bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 px-3 py-1.5 rounded-full text-xs font-medium text-pink-300 cursor-pointer">#일상Vlog</span>
            <span class="bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 px-3 py-1.5 rounded-full text-xs font-medium text-pink-300 cursor-pointer">#귀여운동물</span>
          </div>
        </div>

        <!-- Discover Grid -->
        <div>
          <h3 class="text-sm font-bold text-neutral-400 mb-3">인기 숏츠 🔥</h3>
          <div id="search-grid" class="grid grid-cols-2 gap-3">
            <!-- Rendered by JS -->
          </div>
        </div>
      </section>

      <!-- TAB 3: UPLOAD MODAL TAB -->
      <section id="view-upload" class="w-full h-full bg-neutral-950 p-5 overflow-y-auto flex flex-col justify-between hidden">
        <div>
          <div class="flex justify-between items-center pb-4 border-b border-neutral-800">
            <h2 class="text-lg font-bold flex items-center space-x-2 text-white">
              <i data-lucide="video" class="w-5 h-5 text-pink-500"></i>
              <span>새 숏츠 만들기</span>
            </h2>
            <button onclick="switchTab('home')" class="text-neutral-400 hover:text-white">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>

          <form id="upload-form" class="mt-5 space-y-4" onsubmit="handleUploadSubmit(event)">
            <div class="border-2 border-dashed border-neutral-800 hover:border-pink-500/50 rounded-2xl p-6 flex flex-col items-center justify-center bg-neutral-900/50 transition-colors text-center cursor-pointer relative">
              <input
                type="file"
                id="upload-file-input"
                accept="video/*"
                onchange="handleFileSelect(event)"
                class="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
              />
              <div id="upload-preview-container" class="flex flex-col items-center">
                <div class="w-12 h-12 rounded-full bg-pink-500/10 text-pink-500 flex items-center justify-center mb-2">
                  <i data-lucide="plus" class="w-6 h-6"></i>
                </div>
                <p class="text-sm font-semibold text-neutral-200">동영상 파일 선택</p>
                <p class="text-xs text-neutral-500 mt-1">MP4, MOV 포맷 지원 (최대 60초)</p>
              </div>
              <video id="upload-preview-video" class="max-h-48 rounded-lg object-cover hidden" controls></video>
            </div>

            <div>
              <label class="block text-xs font-semibold text-neutral-400 mb-1.5">영상 설명 (캡션)</label>
              <textarea
                id="upload-caption"
                rows="3"
                placeholder="시청자들에게 전할 이야기를 작성해보세요..."
                class="w-full bg-neutral-900 border border-neutral-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-pink-500 transition-colors resize-none"
              ></textarea>
            </div>

            <div>
              <label class="block text-xs font-semibold text-neutral-400 mb-1.5">해시태그</label>
              <input
                type="text"
                id="upload-tags"
                value="#숏츠톡 #일상"
                class="w-full bg-neutral-900 border border-neutral-800 rounded-xl p-3 text-sm text-pink-400 focus:outline-none focus:border-pink-500 transition-colors"
              />
            </div>

            <button
              type="submit"
              class="w-full py-3.5 bg-gradient-to-r from-pink-500 to-rose-600 font-bold rounded-2xl shadow-lg shadow-pink-500/20 active:scale-95 transition-transform text-white text-sm"
            >
              게시하기 🔥
            </button>
          </form>
        </div>
      </section>

      <!-- TAB 4: PROFILE TAB -->
      <section id="view-profile" class="w-full h-full bg-neutral-950 p-4 overflow-y-auto text-center space-y-5 hidden">
        <div class="pt-4 flex flex-col items-center">
          <div class="relative">
            <img
              src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200"
              alt="profile"
              class="w-20 h-20 rounded-full border-2 border-pink-500 object-cover p-0.5 shadow-xl"
            />
            <div class="absolute bottom-0 right-0 bg-pink-500 p-1 rounded-full text-white">
              <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
            </div>
          </div>

          <h2 class="text-lg font-extrabold mt-3 text-white">나의 숏츠톡</h2>
          <p class="text-xs text-neutral-400 mt-0.5">@my_shorts</p>

          <!-- User Stats Bar -->
          <div class="flex justify-center space-x-6 my-4 py-3 px-6 bg-neutral-900/80 rounded-2xl border border-neutral-800/80">
            <div>
              <div class="text-sm font-bold text-white">128</div>
              <div class="text-[11px] text-neutral-400">팔로잉</div>
            </div>
            <div class="border-r border-neutral-800 h-8"></div>
            <div>
              <div class="text-sm font-bold text-white">4.2K</div>
              <div class="text-[11px] text-neutral-400">팔로워</div>
            </div>
            <div class="border-r border-neutral-800 h-8"></div>
            <div>
              <div id="profile-total-likes" class="text-sm font-bold text-white">18.9K</div>
              <div class="text-[11px] text-neutral-400">좋아요</div>
            </div>
          </div>
        </div>

        <div class="text-left">
          <h3 class="text-xs font-bold text-neutral-400 uppercase tracking-wider mb-2">업로드한 숏츠 목록</h3>
          <div id="profile-grid" class="grid grid-cols-3 gap-2">
            <!-- Rendered by JS -->
          </div>
        </div>
      </section>

      <!-- COMMENTS SLIDE-UP DRAWER -->
      <div id="comment-drawer" class="absolute inset-0 z-50 bg-black/60 backdrop-blur-xs flex flex-col justify-end hidden transition-all duration-300">
        <div class="bg-neutral-900 rounded-t-3xl h-3/4 p-4 flex flex-col border-t border-neutral-800 shadow-2xl">
          
          <div class="flex justify-between items-center pb-3 border-b border-neutral-800">
            <span id="comment-count-title" class="text-sm font-bold text-white">댓글 2개</span>
            <button onclick="closeComments()" class="p-1 text-neutral-400 hover:text-white">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>

          <div id="comment-list-container" class="flex-1 overflow-y-auto py-3 space-y-4">
            <!-- Rendered by JS -->
          </div>

          <form onsubmit="handleAddComment(event)" class="pt-2 border-t border-neutral-800 flex items-center space-x-2">
            <input
              type="text"
              id="comment-input"
              placeholder="따뜻한 댓글을 남겨주세요..."
              class="flex-1 bg-neutral-800 border border-neutral-700 rounded-full px-4 py-2 text-xs text-white focus:outline-none focus:border-pink-500"
            />
            <button
              type="submit"
              class="p-2 rounded-full bg-pink-500 text-white hover:bg-pink-600 transition-colors flex items-center justify-center"
            >
              <i data-lucide="send" class="w-4 h-4"></i>
            </button>
          </form>

        </div>
      </div>

    </main>

    <!-- BOTTOM NAVBAR -->
    <nav class="h-16 bg-black border-t border-neutral-900 flex justify-around items-center px-2 z-30">
      <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center space-y-1 text-pink-500 transition-colors">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">홈</span>
      </button>

      <button onclick="switchTab('search')" id="nav-search" class="flex flex-col items-center space-y-1 text-neutral-500 transition-colors">
        <i data-lucide="search" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">검색</span>
      </button>

      <!-- Center Upload Button (+) -->
      <button onclick="switchTab('upload')" class="group relative flex items-center justify-center">
        <div class="w-11 h-7 rounded-lg bg-gradient-to-r from-cyan-400 via-pink-500 to-rose-500 p-0.5 shadow-md group-active:scale-95 transition-transform">
          <div class="w-full h-full bg-black rounded-[7px] flex items-center justify-center">
            <i data-lucide="plus" class="w-5 h-5 text-white"></i>
          </div>
        </div>
      </button>

      <button onclick="openComments()" class="flex flex-col items-center space-y-1 text-neutral-500 hover:text-neutral-300 transition-colors">
        <i data-lucide="message-circle" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">활동</span>
      </button>

      <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center space-y-1 text-neutral-500 transition-colors">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">프로필</span>
      </button>
    </nav>

  </div>

  <script>
    // Initial Video Dataset
    let videos = [
      {
        id: 1,
        url: 'https://assets.mixkit.co/videos/preview/mixkit-cat-in-a-cardboard-box-42981-large.mp4',
        author: '@cat_master',
        authorName: '고양이 귀여워',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=200',
        description: '상자 속 귀여운 고양이 보러오세요! 🐱📦 #고양이 #귀염뽀짝 #숏츠톡',
        song: '♬ 원본 음성 - cat_master • 인기 사운드',
        likes: 12400,
        comments: 328,
        bookmarks: 890,
        shares: 412,
        isLiked: false,
        isBookmarked: false,
        isFollowing: false
      },
      {
        id: 2,
        url: 'https://assets.mixkit.co/videos/preview/mixkit-waves-in-the-water-1164-large.mp4',
        author: '@traveler_ocean',
        authorName: '바다여행자',
        avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=200',
        description: '오늘 제주도 서귀포 바다 풍경 🌊 힐링하고 가세요~ #제주도 #여행 #바다 #힐링',
        song: '♬ Waves Breeze Chill - OceanVibes',
        likes: 45200,
        comments: 1042,
        bookmarks: 3200,
        shares: 1890,
        isLiked: true,
        isBookmarked: true,
        isFollowing: true
      },
      {
        id: 3,
        url: 'https://assets.mixkit.co/videos/preview/mixkit-woman-dancing-under-neon-lights-42921-large.mp4',
        author: '@dancer_lisa',
        authorName: '댄서 리사',
        avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&q=80&w=200',
        description: '신곡 챌린지 따라해보기! 🔥 다들 함께해요! #댄스챌린지 #숏츠톡 #커버댄스',
        song: '♬ Trending Beats Vol.5 - shorts_music',
        likes: 89300,
        comments: 2450,
        bookmarks: 6710,
        shares: 4310,
        isLiked: false,
        isBookmarked: false,
        isFollowing: false
      }
    ];

    let currentVideoIndex = 0;
    let isMuted = true;
    let activeTab = 'home';
    let lastTapTime = 0;
    let uploadedObjectUrl = null;

    let commentsList = [
      { id: 1, user: '@puppy_love', name: '멍뭉이', avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100', text: '너무 귀여워요!! 심장 아픔 😭', time: '1시간 전' },
      { id: 2, user: '@dance_fan', name: '춤신춤왕', avatar: 'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=100', text: '와 각도 실화인가요?! 멋집니다! 👍', time: '3시간 전' },
    ];

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      toastMsg.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 2500);
    }

    function switchTab(tab) {
      activeTab = tab;

      // Views
      document.getElementById('view-home').classList.toggle('hidden', tab !== 'home');
      document.getElementById('view-search').classList.toggle('hidden', tab !== 'search');
      document.getElementById('view-upload').classList.toggle('hidden', tab !== 'upload');
      document.getElementById('view-profile').classList.toggle('hidden', tab !== 'profile');

      // Top Header only visible on Home
      document.getElementById('top-header').classList.toggle('hidden', tab !== 'home');

      // Bottom Nav styling
      ['home', 'search', 'profile'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (btn) {
          btn.className = `flex flex-col items-center space-y-1 transition-colors ${
            tab === t ? 'text-pink-500' : 'text-neutral-500'
          }`;
        }
      });

      // Pause/play videos depending on active tab
      const allVideos = document.querySelectorAll('video');
      allVideos.forEach((v, idx) => {
        if (tab === 'home' && idx === currentVideoIndex) {
          v.play().catch(() => {});
        } else {
          v.pause();
        }
      });

      if (tab === 'search') renderSearchGrid();
      if (tab === 'profile') renderProfileGrid();
    }

    function setFeedType(type) {
      const tabRec = document.getElementById('tab-recommend');
      const tabFol = document.getElementById('tab-following');
      if (type === 'recommend') {
        tabRec.className = 'text-white border-b-2 border-pink-500 pb-0.5 transition-all';
        tabFol.className = 'text-neutral-400 transition-all';
        showToast('추천 피드로 이동했습니다 🔥');
      } else {
        tabFol.className = 'text-white border-b-2 border-pink-500 pb-0.5 transition-all';
        tabRec.className = 'text-neutral-400 transition-all';
        showToast('팔로잉 피드로 이동했습니다 ✨');
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      const allVideos = document.querySelectorAll('#view-home video');
      allVideos.forEach(v => v.muted = isMuted);

      const muteIcon = document.getElementById('mute-icon');
      muteIcon.setAttribute('data-lucide', isMuted ? 'volume-x' : 'volume-2');
      muteIcon.className = isMuted ? 'w-5 h-5 text-neutral-300' : 'w-5 h-5 text-pink-400';
      lucide.createIcons();
    }

    function renderHomeFeed() {
      const feedContainer = document.getElementById('view-home');
      feedContainer.innerHTML = '';

      videos.forEach((vid, idx) => {
        const item = document.createElement('div');
        item.className = 'w-full h-full snap-start relative flex items-center justify-center bg-neutral-900';

        item.innerHTML = `
          <video
            src="${vid.url}"
            class="w-full h-full object-cover cursor-pointer"
            loop
            playsinline
            ${isMuted ? 'muted' : ''}
            onclick="handleVideoClick(event, ${idx})"
          ></video>

          <!-- Gradient Overlay -->
          <div class="absolute inset-x-0 bottom-0 h-2/5 bg-gradient-to-t from-black/90 via-black/40 to-transparent pointer-events-none"></div>

          <!-- Right Action Bar -->
          <div class="absolute right-3 bottom-12 z-20 flex flex-col items-center space-y-5">
            <!-- Avatar & Follow -->
            <div class="relative">
              <img src="${vid.avatar}" alt="${vid.authorName}" class="w-12 h-12 rounded-full border-2 border-white object-cover shadow-lg" />
              <button onclick="toggleFollow(${idx})" class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-5 h-5 rounded-full flex items-center justify-center transition-transform active:scale-75 ${vid.isFollowing ? 'bg-neutral-600 text-white' : 'bg-pink-500 text-white'}">
                <i data-lucide="${vid.isFollowing ? 'check' : 'plus'}" class="w-3 h-3"></i>
              </button>
            </div>

            <!-- Like Button -->
            <button onclick="toggleLike(event, ${idx})" class="flex flex-col items-center group active:scale-75 transition-transform">
              <div class="p-3 rounded-full bg-black/30 backdrop-blur-md ${vid.isLiked ? 'text-pink-500' : 'text-white'}">
                <i data-lucide="heart" class="w-7 h-7 ${vid.isLiked ? 'fill-pink-500 text-pink-500' : ''}"></i>
              </div>
              <span class="text-xs font-semibold mt-1 drop-shadow">${vid.likes.toLocaleString()}</span>
            </button>

            <!-- Comment Button -->
            <button onclick="openComments()" class="flex flex-col items-center group active:scale-75 transition-transform">
              <div class="p-3 rounded-full bg-black/30 backdrop-blur-md text-white group-hover:text-cyan-400">
                <i data-lucide="message-circle" class="w-7 h-7"></i>
              </div>
              <span class="text-xs font-semibold mt-1 drop-shadow">${vid.comments.toLocaleString()}</span>
            </button>

            <!-- Bookmark Button -->
            <button onclick="toggleBookmark(${idx})" class="flex flex-col items-center group active:scale-75 transition-transform">
              <div class="p-3 rounded-full bg-black/30 backdrop-blur-md ${vid.isBookmarked ? 'text-amber-400' : 'text-white'}">
                <i data-lucide="bookmark" class="w-7 h-7 ${vid.isBookmarked ? 'fill-amber-400' : ''}"></i>
              </div>
              <span class="text-xs font-semibold mt-1 drop-shadow">${vid.bookmarks.toLocaleString()}</span>
            </button>

            <!-- Share Button -->
            <button onclick="shareVideo(${idx})" class="flex flex-col items-center group active:scale-75 transition-transform">
              <div class="p-3 rounded-full bg-black/30 backdrop-blur-md text-white group-hover:text-emerald-400">
                <i data-lucide="share-2" class="w-7 h-7"></i>
              </div>
              <span class="text-xs font-semibold mt-1 drop-shadow">${vid.shares.toLocaleString()}</span>
            </button>

            <!-- Music Record Spinning -->
            <div class="w-10 h-10 rounded-full bg-neutral-800/90 border-2 border-neutral-700 flex items-center justify-center animate-record-spin">
              <i data-lucide="music" class="w-4 h-4 text-pink-400"></i>
            </div>
          </div>

          <!-- Bottom Meta Info -->
          <div class="absolute left-4 bottom-10 right-20 z-20 space-y-2 text-left">
            <div class="flex items-center space-x-2">
              <span class="font-extrabold text-base tracking-wide drop-shadow-md">${vid.authorName}</span>
              <span class="text-xs text-neutral-300 font-medium">${vid.author}</span>
            </div>
            <p class="text-sm font-normal text-neutral-100 leading-snug line-clamp-2 drop-shadow">${vid.description}</p>
            <div class="flex items-center space-x-2 text-xs text-neutral-300 bg-black/30 backdrop-blur-sm px-2.5 py-1 rounded-full w-fit">
              <i data-lucide="music" class="w-3 h-3 text-pink-400 animate-pulse"></i>
              <span class="truncate max-w-[200px] font-medium">${vid.song}</span>
            </div>
          </div>
        `;

        feedContainer.appendChild(item);
      });

      lucide.createIcons();
      attachScrollListener();
    }

    function handleVideoClick(e, index) {
      const now = Date.now();
      const videoEl = e.currentTarget;

      if (now - lastTapTime < 300) {
        // Double Tap Detected
        const rect = videoEl.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        spawnFloatingHeart(videoEl.parentElement, x, y);

        if (!videos[index].isLiked) {
          videos[index].isLiked = true;
          videos[index].likes += 1;
          renderHomeFeed();
        }
      } else {
        // Single Tap Toggle Play / Pause
        if (videoEl.paused) {
          videoEl.play();
        } else {
          videoEl.pause();
        }
      }
      lastTapTime = now;
    }

    function spawnFloatingHeart(parent, x, y) {
      const heart = document.createElement('div');
      heart.className = 'absolute pointer-events-none text-pink-500 z-40 animate-float-heart';
      heart.style.left = `${x}px`;
      heart.style.top = `${y}px`;
      heart.innerHTML = `<i data-lucide="heart" class="w-12 h-12 fill-pink-500 text-pink-500 filter drop-shadow-lg"></i>`;

      parent.appendChild(heart);
      lucide.createIcons();

      setTimeout(() => heart.remove(), 800);
    }

    function toggleLike(e, index) {
      videos[index].isLiked = !videos[index].isLiked;
      videos[index].likes += videos[index].isLiked ? 1 : -1;

      const rect = e.currentTarget.getBoundingClientRect();
      spawnFloatingHeart(e.currentTarget.parentElement, rect.left, rect.top);
      renderHomeFeed();
    }

    function toggleBookmark(index) {
      videos[index].isBookmarked = !videos[index].isBookmarked;
      videos[index].bookmarks += videos[index].isBookmarked ? 1 : -1;
      showToast(videos[index].isBookmarked ? '북마크에 저장되었습니다 📌' : '북마크 저장이 취소되었습니다.');
      renderHomeFeed();
    }

    function toggleFollow(index) {
      videos[index].isFollowing = !videos[index].isFollowing;
      showToast(videos[index].isFollowing ? `${videos[index].authorName}님을 팔로우했습니다 ✨` : `${videos[index].authorName}님 팔로우 취소`);
      renderHomeFeed();
    }

    function shareVideo(index) {
      const text = `숏츠 톡에서 [${videos[index].authorName}]님의 영상 보기: https://shortstalk.app/v/${videos[index].id}`;
      
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);

      showToast('공유 링크가 클립보드에 복사되었습니다! 🔗');
    }

    function attachScrollListener() {
      const container = document.getElementById('view-home');
      container.onscroll = () => {
        const height = container.clientHeight;
        const newIndex = Math.round(container.scrollTop / height);

        if (newIndex !== currentVideoIndex && newIndex >= 0 && newIndex < videos.length) {
          currentVideoIndex = newIndex;
          const allVidEls = container.querySelectorAll('video');
          allVidEls.forEach((v, idx) => {
            if (idx === currentVideoIndex) {
              v.currentTime = 0;
              v.play().catch(() => {});
            } else {
              v.pause();
            }
          });
        }
      };
    }

    function openComments() {
      document.getElementById('comment-drawer').classList.remove('hidden');
      renderComments();
    }

    function closeComments() {
      document.getElementById('comment-drawer').classList.add('hidden');
    }

    function renderComments() {
      const container = document.getElementById('comment-list-container');
      const title = document.getElementById('comment-count-title');
      title.innerText = `댓글 ${commentsList.length}개`;

      container.innerHTML = commentsList.map(c => `
        <div class="flex space-x-3 text-left">
          <img src="${c.avatar}" alt="${c.name}" class="w-8 h-8 rounded-full object-cover" />
          <div class="flex-1">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-neutral-300">${c.name}</span>
              <span class="text-[10px] text-neutral-500">${c.time}</span>
            </div>
            <p class="text-xs text-neutral-200 mt-0.5">${c.text}</p>
          </div>
        </div>
      `).join('');
    }

    function handleAddComment(e) {
      e.preventDefault();
      const input = document.getElementById('comment-input');
      const val = input.value.trim();
      if (!val) return;

      commentsList.unshift({
        id: Date.now(),
        user: '@my_shorts',
        name: '나의 숏츠톡',
        avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200',
        text: val,
        time: '방금 전'
      });

      videos[currentVideoIndex].comments += 1;
      input.value = '';
      renderComments();
      renderHomeFeed();
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) {
        uploadedObjectUrl = URL.createObjectURL(file);
        const container = document.getElementById('upload-preview-container');
        const previewVideo = document.getElementById('upload-preview-video');
        container.classList.add('hidden');
        previewVideo.src = uploadedObjectUrl;
        previewVideo.classList.remove('hidden');
      }
    }

    function handleUploadSubmit(e) {
      e.preventDefault();
      const caption = document.getElementById('upload-caption').value.trim();
      const tags = document.getElementById('upload-tags').value.trim();

      const newVideo = {
        id: Date.now(),
        url: uploadedObjectUrl || 'https://assets.mixkit.co/videos/preview/mixkit-cat-in-a-cardboard-box-42981-large.mp4',
        author: '@my_shorts',
        authorName: '나의 숏츠톡',
        avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200',
        description: `${caption} ${tags}`,
        song: '♬ 나만의 오리지널 음성',
        likes: 0,
        comments: 0,
        bookmarks: 0,
        shares: 0,
        isLiked: false,
        isBookmarked: false,
        isFollowing: false
      };

      videos.unshift(newVideo);
      currentVideoIndex = 0;
      
      // Reset upload form
      document.getElementById('upload-form').reset();
      document.getElementById('upload-preview-container').classList.remove('hidden');
      document.getElementById('upload-preview-video').classList.add('hidden');
      uploadedObjectUrl = null;

      showToast('새 숏츠가 성공적으로 업로드되었습니다! 🎉');
      switchTab('home');
      renderHomeFeed();
    }

    function renderSearchGrid() {
      const container = document.getElementById('search-grid');
      container.innerHTML = videos.map(vid => `
        <div onclick="switchTab('home')" class="relative aspect-[9/16] rounded-2xl overflow-hidden bg-neutral-900 border border-neutral-800 cursor-pointer group">
          <video src="${vid.url}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"></video>
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent flex flex-col justify-end p-2.5">
            <span class="text-xs font-bold text-white line-clamp-1">${vid.authorName}</span>
            <div class="flex items-center space-x-1 text-[10px] text-neutral-300 mt-1">
              <i data-lucide="heart" class="w-3 h-3 fill-pink-500 text-pink-500"></i>
              <span>${vid.likes.toLocaleString()}</span>
            </div>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function renderProfileGrid() {
      const container = document.getElementById('profile-grid');
      container.innerHTML = videos.map(v => `
        <div class="relative aspect-[9/16] bg-neutral-900 rounded-xl overflow-hidden border border-neutral-800">
          <video src="${v.url}" class="w-full h-full object-cover"></video>
          <div class="absolute bottom-1 left-1.5 flex items-center space-x-1 text-[10px] text-white">
            <i data-lucide="heart" class="w-2.5 h-2.5 fill-pink-500 text-pink-500"></i>
            <span>${v.likes}</span>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    // App Initialization on Window Load
    window.onload = function () {
      renderHomeFeed();
      lucide.createIcons();
      // Auto play first video
      const firstVid = document.querySelector('#view-home video');
      if (firstVid) firstVid.play().catch(() => {});
    };
  </script>
</body>
</html>
