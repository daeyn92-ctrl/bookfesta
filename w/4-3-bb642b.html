        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.8);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            50% { box-shadow: 0 0 25px rgba(255, 105, 180, 0.9), inset 0 0 15px rgba(255, 255, 255, 1); }

            cursor: grab;

    <script>
        class ASMRSoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.noiseBuffer = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    this.createNoiseBuffer();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Create white noise buffer for crunchy sherbet effect
            createNoiseBuffer() {
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 2;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                this.noiseBuffer = buffer;
            }

            // Play Sherbet Crunch sound ("사각사각", "뽀드득")
            playSherbetCrunch(intensity = 0.5, densityType = 'sherbet') {
                if (!this.enabled) return;
                this.init();

                const now = this.ctx.currentTime;
                const duration = 0.08 + Math.random() * 0.08;

                // Noise Source
                const noiseSource = this.ctx.createBufferSource();
                noiseSource.buffer = this.noiseBuffer;

                // Bandpass Filter for Icy Sherbet Frequency Tone
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';

                let centerFreq = 3000 + Math.random() * 2000;
                let qValue = 3.0;

                if (densityType === 'crunch') {
                    centerFreq = 4500 + Math.random() * 2500; // Sharp crunchy ice
                    qValue = 4.5;
                } else if (densityType === 'cloud') {
                    centerFreq = 1800 + Math.random() * 1200; // Soft fluff cloud
                    qValue = 1.5;
                }

                filter.frequency.setValueAtTime(centerFreq, now);
                filter.Q.setValueAtTime(qValue, now);

                // Gain Envelope
                const gain = this.ctx.createGain();
                const vol = Math.min(0.4, 0.05 + intensity * 0.25);
                gain.gain.setValueAtTime(vol, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                noiseSource.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noiseSource.start(now);
                noiseSource.stop(now + duration);
            }

            // Play Bubble Pop / Squish sound
            playBubblePop() {
                if (!this.enabled) return;
                this.init();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                const startFreq = 400 + Math.random() * 300;
                const endFreq = 900 + Math.random() * 400;

                osc.frequency.setValueAtTime(startFreq, now);
                osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.06);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.06);
            }
        }

        const asmrSound = new ASMRSoundEngine();

        class SlimePhysicsEngine {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                
                this.width = canvas.width;
                this.height = canvas.height;

                this.numPoints = 32;
                this.points = [];
                this.center = { x: 0, y: 0 };
                this.baseRadius = 150;

                // Slime Custom State
                this.flavor = 'peach'; // peach, mint, blueberry, rainbow, lemon, soda
                this.textureType = 'sherbet'; // sherbet, crunch, cloud
                this.toppings = []; // { x, y, icon, angle, scale }
                this.sherbetGrains = []; // Frosty ice grain particles

                // Drag state
                this.isDragging = false;
                this.dragPoint = null;
                this.pointerPos = { x: 0, y: 0 };

                this.initSlime();
            }

            resize(w, h) {
                this.width = w;
                this.height = h;
                this.canvas.width = w;
                this.canvas.height = h;
                this.center = { x: w / 2, y: h / 2 };
                this.baseRadius = Math.min(w, h) * 0.25;
                this.repositionPoints();
            }

            initSlime() {
                this.center = { x: this.width / 2, y: this.height / 2 };
                this.points = [];
                for (let i = 0; i < this.numPoints; i++) {
                    const angle = (i / this.numPoints) * Math.PI * 2;
                    const x = this.center.x + Math.cos(angle) * this.baseRadius;
                    const y = this.center.y + Math.sin(angle) * this.baseRadius;
                    this.points.push({
                        x: x,
                        y: y,
                        originX: x,
                        originY: y,
                        vx: 0,
                        vy: 0,
                        angle: angle,
                        radius: this.baseRadius
                    });
                }

                // Generate Sherbet Grains Inside Blob
                this.sherbetGrains = [];
                for (let i = 0; i < 350; i++) {
                    const r = Math.random() * 0.85;
                    const a = Math.random() * Math.PI * 2;
                    this.sherbetGrains.push({
                        rNorm: r,
                        angle: a,
                        size: 1 + Math.random() * 2.5,
                        opacity: 0.3 + Math.random() * 0.6
                    });
                }
            }

            repositionPoints() {
                for (let i = 0; i < this.numPoints; i++) {
                    const angle = this.points[i].angle;
                    this.points[i].originX = this.center.x + Math.cos(angle) * this.baseRadius;
                    this.points[i].originY = this.center.y + Math.sin(angle) * this.baseRadius;
                }
            }

            update() {
                // Spring physics update for outer perimeter nodes
                for (let i = 0; i < this.points.length; i++) {
                    const p = this.points[i];

                    // Spring back force towards origin radius
                    const dx = p.originX - p.x;
                    const dy = p.originY - p.y;

                    p.vx += dx * 0.04;
                    p.vy += dy * 0.04;

                    // Damping
                    p.vx *= 0.82;
                    p.vy *= 0.82;

                    p.x += p.vx;
                    p.y += p.vy;
                }

                // Interaction force on drag/touch
                if (this.isDragging) {
                    // Push nearby points or stretch
                    for (let i = 0; i < this.points.length; i++) {
                        const p = this.points[i];
                        const dist = Math.hypot(this.pointerPos.x - p.x, this.pointerPos.y - p.y);
                        if (dist < 120) {
                            const force = (120 - dist) * 0.15;
                            const angle = Math.atan2(p.y - this.pointerPos.y, p.x - this.pointerPos.x);
                            p.vx += Math.cos(angle) * force;
                            p.vy += Math.sin(angle) * force;
                        }
                    }
                }
            }

            // Poke Action
            poke(x, y) {
                this.pointerPos = { x, y };
                let hit = false;
                for (let i = 0; i < this.points.length; i++) {
                    const p = this.points[i];
                    const dist = Math.hypot(x - p.x, y - p.y);
                    if (dist < this.baseRadius * 1.5) {
                        hit = true;
                        const force = - (180 - dist) * 0.35;
                        const angle = Math.atan2(y - this.center.y, x - this.center.x);
                        p.vx += Math.cos(angle) * force;
                        p.vy += Math.sin(angle) * force;
                    }
                }

                // Sound & particle feedback
                asmrSound.playSherbetCrunch(0.8, this.textureType);
                if (Math.random() < 0.4) asmrSound.playBubblePop();

                return hit;
            }

            // Slap / Big Squish Action
            slap() {
                for (let i = 0; i < this.points.length; i++) {
                    const p = this.points[i];
                    const randomForce = (Math.random() - 0.5) * 45;
                    p.vx += randomForce;
                    p.vy += randomForce;
                }
                asmrSound.playSherbetCrunch(1.0, this.textureType);
                asmrSound.playBubblePop();
            }

            draw() {
                this.ctx.clearRect(0, 0, this.width, this.height);

                if (this.points.length === 0) return;

                // 1. Draw Drop Shadow
                this.ctx.save();
                this.ctx.beginPath();
                this.drawBlobPath();
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
                this.ctx.filter = 'blur(12px)';
                this.ctx.fill();
                this.ctx.restore();

                // 2. Main Slime Body Fill
                this.ctx.save();
                this.ctx.beginPath();
                this.drawBlobPath();

                // Gradient setup based on flavor
                const grad = this.getSlimeGradient();
                this.ctx.fillStyle = grad;
                this.ctx.fill();

                // Frosty Inner Glow Border
                this.ctx.lineWidth = 8;
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                this.ctx.stroke();

                // Clip area for Sherbet Grains
                this.ctx.clip();

                // 3. Render Sherbet Icy Texture Grains
                for (let i = 0; i < this.sherbetGrains.length; i++) {
                    const g = this.sherbetGrains[i];
                    const rCurr = g.rNorm * this.baseRadius * 0.9;
                    const gx = this.center.x + Math.cos(g.angle) * rCurr;
                    const gy = this.center.y + Math.sin(g.angle) * rCurr;

                    this.ctx.beginPath();
                    this.ctx.arc(gx, gy, g.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(255, 255, 255, ${g.opacity})`;
                    this.ctx.fill();
                }

                // 4. Highlight Shimmer
                this.ctx.beginPath();
                this.ctx.ellipse(this.center.x - this.baseRadius * 0.3, this.center.y - this.baseRadius * 0.35, this.baseRadius * 0.3, this.baseRadius * 0.15, -Math.PI / 6, 0, Math.PI * 2);
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                this.ctx.fill();

                this.ctx.restore();

                // 5. Render Toppings
                this.drawToppings();
            }

            drawBlobPath() {
                const p0 = this.points[0];
                const pLast = this.points[this.points.length - 1];
                const midX = (pLast.x + p0.x) / 2;
                const midY = (pLast.y + p0.y) / 2;

                this.ctx.moveTo(midX, midY);

                for (let i = 0; i < this.points.length; i++) {
                    const pCurrent = this.points[i];
                    const pNext = this.points[(i + 1) % this.points.length];
                    const xc = (pCurrent.x + pNext.x) / 2;
                    const yc = (pCurrent.y + pNext.y) / 2;
                    this.ctx.quadraticCurveTo(pCurrent.x, pCurrent.y, xc, yc);
                }
            }

            getSlimeGradient() {
                const g = this.ctx.createRadialGradient(
                    this.center.x - this.baseRadius * 0.2,
                    this.center.y - this.baseRadius * 0.2,
                    10,
                    this.center.x,
                    this.center.y,
                    this.baseRadius * 1.3
                );

                switch (this.flavor) {
                    case 'mint':
                        g.addColorStop(0, '#a7f3d0');
                        g.addColorStop(0.6, '#34d399');
                        g.addColorStop(1, '#059669');
                        break;
                    case 'blueberry':
                        g.addColorStop(0, '#c084fc');
                        g.addColorStop(0.6, '#a855f7');
                        g.addColorStop(1, '#7e22ce');
                        break;
                    case 'rainbow':
                        g.addColorStop(0, '#fef08a');
                        g.addColorStop(0.5, '#fbcfe8');
                        g.addColorStop(1, '#a5f3fc');
                        break;
                    case 'lemon':
                        g.addColorStop(0, '#fef08a');
                        g.addColorStop(0.6, '#fde047');
                        g.addColorStop(1, '#eab308');
                        break;
                    case 'soda':
                        g.addColorStop(0, '#bae6fd');
                        g.addColorStop(0.6, '#38bdf8');
                        g.addColorStop(1, '#0284c7');
                        break;
                    case 'peach':
                    default:
                        g.addColorStop(0, '#fbcfe8');
                        g.addColorStop(0.6, '#f472b6');
                        g.addColorStop(1, '#db2777');
                        break;
                }
                return g;
            }

            addTopping(icon) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * this.baseRadius * 0.7;
                this.toppings.push({
                    normX: Math.cos(angle) * dist,
                    normY: Math.sin(angle) * dist,
                    icon: icon,
                    size: 20 + Math.random() * 10,
                    rotation: (Math.random() - 0.5) * 0.8
                });
                asmrSound.playBubblePop();
            }

            drawToppings() {
                this.ctx.font = '22px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';

                for (let i = 0; i < this.toppings.length; i++) {
                    const top = this.toppings[i];
                    const tx = this.center.x + top.normX;
                    const ty = this.center.y + top.normY;

                    this.ctx.save();
                    this.ctx.translate(tx, ty);
                    this.ctx.rotate(top.rotation);
                    this.ctx.fillText(top.icon, 0, 0);
                    this.ctx.restore();
                }
            }
        }

        let slime = null;

        // Audition Mode State
        let isAuditionActive = false;
        let auditionTimerVal = 10;
        let auditionTimerInterval = null;
        let auditionScoreVal = 0;

        window.onload = () => {
            const canvas = document.getElementById('slimeCanvas');
            slime = new SlimePhysicsEngine(canvas);

            function handleResize() {
                const main = canvas.parentElement;
                slime.resize(main.clientWidth, main.clientHeight);
            }
            window.addEventListener('resize', handleResize);
            handleResize();

            // Main Animation Loop
            function animate() {
                slime.update();
                slime.draw();
                requestAnimationFrame(animate);
            }
            animate();

            // Setup Touch & Mouse Interaction Events
            setupCanvasInteraction(canvas);

            // Setup UI Tabs & Controls
            setupUIControls();
        };

        function setupCanvasInteraction(canvas) {
            const touchHint = document.getElementById('touchHint');

            function getCanvasPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }

            function onStart(e) {
                if (touchHint) touchHint.style.opacity = '0';
                const pos = getCanvasPos(e);
                slime.isDragging = true;
                slime.pointerPos = pos;
                slime.poke(pos.x, pos.y);

                if (isAuditionActive) {
                    auditionScoreVal += Math.floor(15 + Math.random() * 20);
                    updateAuditionScoreUI();
                }
            }

            function onMove(e) {
                if (!slime.isDragging) return;
                const pos = getCanvasPos(e);
                slime.pointerPos = pos;
                
                // Continuous audio on stretch
                if (Math.random() < 0.25) {
                    asmrSound.playSherbetCrunch(0.4, slime.textureType);
                    if (isAuditionActive) {
                        auditionScoreVal += 5;
                        updateAuditionScoreUI();
                    }
                }
            }

            function onEnd() {
                slime.isDragging = false;
            }

            canvas.addEventListener('mousedown', onStart);
            canvas.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);

            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(e); }, { passive: false });
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onMove(e); }, { passive: false });
            window.addEventListener('touchend', onEnd);
        }

        function setupUIControls() {
            // Sound Toggle Button
            const soundBtn = document.getElementById('btnSoundToggle');
            const soundIcon = document.getElementById('soundIcon');
            soundBtn.onclick = () => {
                asmrSound.enabled = !asmrSound.enabled;
                soundIcon.className = asmrSound.enabled ? "fa-solid fa-volume-high text-base" : "fa-solid fa-volume-xmark text-base text-pink-400";
                showToast(asmrSound.enabled ? "🔊 ASMR 사운드 켜짐" : "🔇 ASMR 사운드 꺼짐");
            };

            // Quick Actions
            document.getElementById('btnClearToppings').onclick = () => {
                slime.toppings = [];
                showToast("✨ 토핑이 깔끔하게 정리되었습니다.");
            };
            document.getElementById('btnAddRandomTopping').onclick = () => {
                const list = ['⭐', '🍓', '💖', '⚪', '✨', '🍋', '🫐', '🌸'];
                const randomIcon = list[Math.floor(Math.random() * list.length)];
                slime.addTopping(randomIcon);
            };
            document.getElementById('btnSquishSlap').onclick = () => {
                slime.slap();
                showToast("💥 팡팡! 슬라임을 흔들었습니다!");
            };

            // Category Tab Switches
            const tabColor = document.getElementById('tabColor');
            const tabTexture = document.getElementById('tabTexture');
            const tabTopping = document.getElementById('tabTopping');

            const panelColor = document.getElementById('panelColor');
            const panelTexture = document.getElementById('panelTexture');
            const panelTopping = document.getElementById('panelTopping');

            function switchTab(activeTab, activePanel) {
                [tabColor, tabTexture, tabTopping].forEach(t => {
                    t.className = "px-4 py-1.5 rounded-2xl bg-white/70 text-pink-900 font-jua text-xs font-bold hover:bg-white transition flex items-center gap-1.5";
                });
                [panelColor, panelTexture, panelTopping].forEach(p => p.classList.add('hidden'));

                activeTab.className = "px-4 py-1.5 rounded-2xl bg-pink-500 text-white font-jua text-xs font-bold shadow transition flex items-center gap-1.5";
                activePanel.classList.remove('hidden');
            }

            tabColor.onclick = () => switchTab(tabColor, panelColor);
            tabTexture.onclick = () => switchTab(tabTexture, panelTexture);
            tabTopping.onclick = () => switchTab(tabTopping, panelTopping);

            // Flavor Buttons
            document.querySelectorAll('.flavor-btn').forEach(btn => {
                btn.onclick = () => {
                    const flavor = btn.getAttribute('data-flavor');
                    slime.flavor = flavor;
                    asmrSound.playBubblePop();
                    showToast(`🍧 ${btn.innerText.trim()} 맛 슬라임 변신!`);
                };
            });

            // Texture Buttons
            document.querySelectorAll('.texture-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.texture-btn').forEach(b => b.className = "texture-btn flex-1 py-2 rounded-2xl bg-white/80 text-pink-900 font-jua text-xs border border-pink-200 text-center hover:bg-pink-100 transition");
                    btn.className = "texture-btn flex-1 py-2 rounded-2xl bg-pink-500 text-white font-jua text-xs border border-pink-500 text-center shadow transition";
                    
                    const tex = btn.getAttribute('data-texture');
                    slime.textureType = tex;
                    asmrSound.playSherbetCrunch(0.8, tex);
                    showToast(`✨ ${btn.innerText.trim()} 촉감으로 변경`);
                };
            });

            // Topping Buttons
            document.querySelectorAll('.topping-btn').forEach(btn => {
                btn.onclick = () => {
                    const topIcon = btn.getAttribute('data-topping');
                    slime.addTopping(topIcon);
                };
            });

            // Audition Mode Controls
            const btnAuditionMode = document.getElementById('btnAuditionMode');
            const auditionOverlay = document.getElementById('auditionOverlay');

            btnAuditionMode.onclick = () => {
                if (isAuditionActive) return;
                startAuditionMode();
            };

            document.getElementById('btnCloseAuditionModal').onclick = () => {
                document.getElementById('modalAuditionResult').classList.add('hidden');
            };
        }

        function startAuditionMode() {
            isAuditionActive = true;
            auditionTimerVal = 10;
            auditionScoreVal = 0;

            const auditionOverlay = document.getElementById('auditionOverlay');
            auditionOverlay.classList.remove('hidden');

            updateAuditionScoreUI();

            showToast("🎙️ 10초 ASMR 오디션 시작! 슬라임을 마음껏 만져보세요!");

            if (auditionTimerInterval) clearInterval(auditionTimerInterval);

            auditionTimerInterval = setInterval(() => {
                auditionTimerVal--;
                document.getElementById('auditionTimer').innerText = `${auditionTimerVal}s`;
                document.getElementById('auditionProgressBar').style.width = `${((10 - auditionTimerVal) / 10) * 100}%`;

                if (auditionTimerVal <= 0) {
                    clearInterval(auditionTimerInterval);
                    endAuditionMode();
                }
            }, 1000);
        }

        function updateAuditionScoreUI() {
            document.getElementById('auditionScore').innerText = auditionScoreVal;
        }

        function endAuditionMode() {
            isAuditionActive = false;
            document.getElementById('auditionOverlay').classList.add('hidden');

            // Calculate Audition Results
            const soundScore = Math.min(100, Math.floor(auditionScoreVal * 0.4 + 40));
            const rhythmScore = Math.min(100, Math.floor(auditionScoreVal * 0.5 + 35));
            const totalScore = Math.floor((soundScore + rhythmScore) / 2);

            document.getElementById('resScoreSound').innerText = `${soundScore}점`;
            document.getElementById('resScoreRhythm').innerText = `${rhythmScore}점`;

            let grade = "S급 명품 샤베트";
            let comment = `"사각사각 소리와 리듬감이 일품입니다! 보는 사람까지 기분 좋아지는 소리예요!"`;

            if (totalScore >= 95) {
                grade = "👑 전설의 갓-샤베트 슬라임";
                comment = `"완벽한 오디오 밸런스와 극상의 쫀득함! 심사위원 전원 만점입니다!"`;
            } else if (totalScore < 70) {
                grade = "🍧 귀여운 새싹 샤베트";
                comment = `"소리가 아주 귀여워요! 조금 더 리드미컬하게 만져주면 최고일 것 같아요!"`;
            }

            document.getElementById('resGrade').innerText = grade;
            document.getElementById('resComment').innerText = comment;

            document.getElementById('modalAuditionResult').classList.remove('hidden');
        }

        // Toast Notification System
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = msg;

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            }, 2000);
        }
    </script>
</body>
</html>
