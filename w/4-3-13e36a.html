<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무한 동물 세상 - Infinite Animal World</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
            user-select: none;
            touch-action: manipulation;
            overflow: hidden;
            background-color: #0f172a;
        }

        /* Custom Scrollbar for panel */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 999px;
        }

        /* Glassmorphism Styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }
        .glass-btn:active, .glass-btn.active {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-color: #a7f3d0;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        /* Rainbow Text Effect */
        .rainbow-text {
            background: linear-gradient(90deg, #ff0055, #ffaa00, #33ff00, #00e5ff, #7000ff, #ff0055);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            animation: rainbowShift 3s linear infinite;
        }

        @keyframes rainbowShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* Pulse glow animation */
        .pulse-glow {
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px rgba(245, 158, 11, 0.4); }
            100% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.9); }
        }
    </style>
</head>

    <script>
        // ==========================================
        // Sound Engine (Web Audio API Synthesizer)
        // ==========================================
        class AnimalSoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playPop(pitchMultiplier = 1.0) {
                if (!this.enabled) return;
                this.init();
                
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    // Bubble pop frequency envelope
                    const startFreq = 220 * pitchMultiplier;
                    const endFreq = 660 * pitchMultiplier;

                    osc.frequency.setValueAtTime(startFreq, now);
                    osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.08);

                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.09);
                } catch(e) { console.error(e); }
            }

            playTsunamiSound() {
                if (!this.enabled) return;
                this.init();

                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.4);

                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.45);
                } catch(e) { console.error(e); }
            }
        }

        const audio = new AnimalSoundEngine();

        // ==========================================

        // ==========================================
        const BACKGROUNDS = [
            {

            },

                icon: '🌌',
                bgGradient: ['#311b92', '#1a237e', '#000000'],
                particleColor: '#f472b6',
                particleType: 'star',
                groundHeight: 1.0
            },
            {
                id: 'snow',
                name: '포근한 설원',
                icon: '❄️',
                bgGradient: ['#94a3b8', '#475569', '#0f172a'],
                particleColor: '#f8fafc',
                particleType: 'snow',
                groundHeight: 0.85
            },
            {
                id: 'desert',
                name: '황금 사막',
                icon: '🏜️',
                bgGradient: ['#d97706', '#b45309', '#451a03'],
                particleColor: '#fde68a',
                particleType: 'dust',
                groundHeight: 0.85
            },
            {
                id: 'rainbow',
                name: '무지개 판타지',
                icon: '🦄',

                particleColor: '#f43f5e',
                particleType: 'sparkle',
                groundHeight: 0.88
            }
        ];

        const SPECIES_CATEGORIES = [
            {
                id: 'all',
                name: '🎲 전종 무작위',
                emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐦', '🐤', '🦆', '🦅', '🦉', '🦇', '🐺', '🐗', '🐴', '🦄', '🐝', '🐛', '🦋', '🐌', '🐞', '🐢', '🐍', '🐙', '🦑', '🦐', '🦞', '🦀', '🐡', '🐠', '🐟', '🐬', '🐳', '🦈', '🐊', '🐅', '🐆', '🦓', '🦍', '🦧', '🦣', '🐘', '🦛', '🦏', '🐪', '🐫', '🦒', '🦘', '🦬', '🦙', '🦩', '🦚', '🦜', '🦡', '🦦', '🦥', '🦦', '🦫', '🦔', '🦕', '🦖']
            },
            {
                id: 'pets',
                name: '🐶 귀여운 반려동물',
                emojis: ['🐶', '🐱', '🐭', '🐹', '🐰', '🐥', '🐱‍👤', '🦮', '🐩', '🐈', '🦜', '🦔', '🦫', '🦥', '🐿️']
            },
            {
                id: 'wild',
                name: '🦁 야생 정글 동물',
                emojis: ['🦁', '🐯', '🐻', '🐼', '🐨', '🦊', '🐺', '🐗', '🐵', '🦍', '🦧', '🐘', '🦛', '🦏', '🐪', '🐫', '🦒', '🦘', '🦬', '🦓', '🐆', '🐅']
            },
            {
                id: 'ocean',
                name: '🐬 바다 & 수중 친구들',
                emojis: ['🐬', '🐳', '🐋', '🦈', '🦭', '🐙', '🦑', '🦐', '🦞', '🦀', '🐡', '🐠', '🐟', '🐢', '🐊', '펭']
            },
            {
                id: 'birds',
                name: '🦅 하늘 날개 친구들',

            },
            {
                id: 'fantasy',
                name: '🦖 공룡 & 전설',
                emojis: ['🦖', '🦕', '🦄', '🐲', '🐉', '🦣', '🕊️', '✨']
            }
        ];

        // ==========================================
        // State Management
        // ==========================================
        let currentBgIndex = 0;
        let selectedCategoryIndex = 0;
        let activeEmojiList = [...SPECIES_CATEGORIES[0].emojis];
        let spawnRate = 5; // animals per second
        let movementPattern = 'walk';
        let baseAnimalSize = 48;

        let totalSpawnedCount = 0;
        let animals = [];
        let ambientParticles = [];
        let clickEffects = [];

        // Canvas Setup
        const canvas = document.getElementById('world-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ==========================================
        // Animal Entity Class
        // ==========================================
        class AnimalEntity {
            constructor(x, y, emojiOverride = null) {
                this.x = x !== undefined ? x : Math.random() * canvas.width;
                this.y = y !== undefined ? y : Math.random() * (canvas.height * 0.7) + canvas.height * 0.1;
                
                // Emoji Selection
                if (emojiOverride) {
                    this.emoji = emojiOverride;
                } else {
                    const idx = Math.floor(Math.random() * activeEmojiList.length);
                    this.emoji = activeEmojiList[idx] || '🐶';
                }

                // Random variations
                this.size = baseAnimalSize * (0.75 + Math.random() * 0.5);
                this.vx = (Math.random() - 0.5) * (movementPattern === 'frenzy' ? 12 : 3);
                this.vy = (Math.random() - 0.5) * (movementPattern === 'frenzy' ? 12 : 2);
                
                // Animation properties
                this.wobblePhase = Math.random() * Math.PI * 2;
                this.wobbleSpeed = 0.05 + Math.random() * 0.05;
                this.scaleX = Math.random() > 0.5 ? 1 : -1; // Facing direction
                this.jumpHeight = 5 + Math.random() * 15;
                this.opacity = 0; // Fade in

                // Birth effect
                this.spawnScale = 0.1;

                totalSpawnedCount++;
            }

            update(dt) {
                // Fade in and pop growth
                if (this.opacity < 1) this.opacity += 0.08;
                if (this.spawnScale < 1) this.spawnScale += 0.12;

                this.wobblePhase += this.wobbleSpeed;

                // Movement Pattern Behaviors
                switch (movementPattern) {
                    case 'walk':
                        this.x += this.vx;
                        // Bounce on ground horizon
                        const groundY = canvas.height * BACKGROUNDS[currentBgIndex].groundHeight - this.size;
                        if (this.y < groundY - 50) {
                            this.vy += 0.3; // Gravity
                        } else {
                            this.vy = -Math.abs(Math.sin(this.wobblePhase) * 4); // Continuous gentle hopping
                        }
                        this.y += this.vy;
                        break;

                    case 'float':
                        this.x += Math.cos(this.wobblePhase) * 2 + this.vx * 0.5;
                        this.y += Math.sin(this.wobblePhase) * 2 + this.vy * 0.5;
                        break;

                    case 'rain':
                        this.y += Math.abs(this.vy) + 3;
                        this.x += Math.sin(this.wobblePhase);
                        if (this.y > canvas.height + 50) {
                            this.y = -50;
                            this.x = Math.random() * canvas.width;
                        }
                        break;

                    case 'frenzy':
                        this.x += this.vx;
                        this.y += this.vy;
                        break;
                }

                // Screen Boundary Wrap / Bounce
                if (this.x < -60) {
                    this.x = canvas.width + 50;
                } else if (this.x > canvas.width + 60) {
                    this.x = -50;
                }

                if (movementPattern !== 'rain') {
                    if (this.y < 50) {
                        this.y = 50;
                        this.vy *= -1;
                    } else if (this.y > canvas.height - 40) {
                        this.y = canvas.height - 40;
                        this.vy *= -1;
                    }
                }

                // Update facing direction based on movement direction
                if (Math.abs(this.vx) > 0.1) {
                    this.scaleX = this.vx > 0 ? 1 : -1;
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Apply wobble rotation & scale
                const wobbleRot = Math.sin(this.wobblePhase) * 0.15;
                const currentScale = Math.min(1.0, this.spawnScale);
                
                ctx.scale(this.scaleX * currentScale, currentScale);
                ctx.rotate(wobbleRot);

                ctx.font = `${Math.floor(this.size)}px "Apple Color Emoji", "Segoe UI Emoji", NotoColorEmoji, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.globalAlpha = Math.min(1.0, this.opacity);

                // Draw Animal Emoji
                ctx.fillText(this.emoji, 0, 0);

                ctx.restore();
            }
        }

        // ==========================================
        // Ambient Background Particle System
        // ==========================================
        class AmbientParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 6 + 2;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = -Math.random() * 1.5 - 0.5;
                this.alpha = Math.random() * 0.7 + 0.3;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.y < -20 || this.x < -20 || this.x > canvas.width + 20) {
                    this.reset();
                    this.y = canvas.height + 10;
                }
            }

            draw(ctx, color) {
                ctx.save();
                ctx.fillStyle = color;
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Initialize Ambient Particles
        for (let i = 0; i < 60; i++) {
            ambientParticles.push(new AmbientParticle());
        }

        // ==========================================
        // UI & Event Controller
        // ==========================================
        function initUI() {
            // Render Background Selection Grid
            const bgGrid = document.getElementById('bg-grid');
            bgGrid.innerHTML = '';
            BACKGROUNDS.forEach((bg, idx) => {
                const btn = document.createElement('button');
                btn.className = `glass-btn p-2 rounded-xl flex flex-col items-center justify-center text-xs font-bold transition ${idx === currentBgIndex ? 'active ring-2 ring-amber-400' : ''}`;
                btn.innerHTML = `<span class="text-xl mb-1">${bg.icon}</span><span class="truncate w-full text-center text-[11px]">${bg.name}</span>`;
                btn.addEventListener('click', () => {
                    currentBgIndex = idx;
                    document.querySelectorAll('#bg-grid button').forEach((b, i) => {
                        b.classList.toggle('active', i === idx);
                        b.classList.toggle('ring-2', i === idx);
                        b.classList.toggle('ring-amber-400', i === idx);
                    });
                });
                bgGrid.appendChild(btn);
            });

            // Render Species Category Tabs
            const tabsContainer = document.getElementById('species-category-tabs');
            tabsContainer.innerHTML = '';
            SPECIES_CATEGORIES.forEach((cat, idx) => {
                const tab = document.createElement('button');
                tab.className = `px-3 py-1.5 rounded-xl text-xs font-bold transition ${idx === selectedCategoryIndex ? 'bg-amber-400 text-slate-950 shadow-md' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`;
                tab.innerText = cat.name;
                tab.addEventListener('click', () => {
                    selectedCategoryIndex = idx;
                    activeEmojiList = [...cat.emojis];
                    document.querySelectorAll('#species-category-tabs button').forEach((t, i) => {
                        t.className = `px-3 py-1.5 rounded-xl text-xs font-bold transition ${i === idx ? 'bg-amber-400 text-slate-950 shadow-md' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`;
                    });
                    renderEmojiGrid();
                });
                tabsContainer.appendChild(tab);
            });

            renderEmojiGrid();
        }

        function renderEmojiGrid() {
            const emojiGrid = document.getElementById('animal-emoji-grid');
            emojiGrid.innerHTML = '';
            const currentCat = SPECIES_CATEGORIES[selectedCategoryIndex];

            currentCat.emojis.forEach(emoji => {
                const item = document.createElement('div');
                item.className = 'w-9 h-9 rounded-xl bg-slate-800/80 border border-slate-700 hover:border-amber-400 hover:bg-slate-700 flex items-center justify-center text-lg cursor-pointer transition active:scale-95';
                item.innerText = emoji;
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // Single spawn clicked emoji at center of canvas
                    const a = new AnimalEntity(canvas.width / 2 + (Math.random() - 0.5) * 100, canvas.height / 2 + (Math.random() - 0.5) * 100, emoji);
                    animals.push(a);
                    audio.playPop(1.2);
                });
                emojiGrid.appendChild(item);
            });
        }

        // Panel Toggle Controls
        const controlPanel = document.getElementById('control-panel');
        document.getElementById('btn-toggle-panel').addEventListener('click', () => {
            controlPanel.classList.toggle('translate-y-full');
        });
        document.getElementById('btn-close-panel').addEventListener('click', () => {
            controlPanel.classList.add('translate-y-full');
        });

        // Tsunami / Massive Burst Spawn
        document.getElementById('btn-tsunami').addEventListener('click', () => {
            audio.playTsunamiSound();
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height * 0.8;
                    animals.push(new AnimalEntity(x, y));
                }, i * 15);
            }
        });

        // Clear Canvas
        document.getElementById('btn-clear').addEventListener('click', () => {
            animals = [];
        });

        // Sound Toggle
        document.getElementById('btn-sound').addEventListener('click', () => {
            audio.enabled = !audio.enabled;
            const icon = document.getElementById('sound-icon');
            const text = document.getElementById('sound-text');
            if (audio.enabled) {
                icon.className = 'fa-solid fa-volume-high text-lg mb-1';
                text.innerText = '소리 켬';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-lg mb-1 text-red-400';
                text.innerText = '음소거';
            }
        });

        // Sliders & Select Events
        const spawnSlider = document.getElementById('spawn-speed-slider');
        const speedDisplay = document.getElementById('speed-val-display');
        spawnSlider.addEventListener('input', (e) => {
            spawnRate = parseInt(e.target.value);
            speedDisplay.innerText = spawnRate === 0 ? '수동 터치 전용' : `초당 ${spawnRate}마리`;
        });

        document.getElementById('movement-select').addEventListener('change', (e) => {
            movementPattern = e.target.value;
        });

        const sizeSlider = document.getElementById('animal-size-slider');
        const sizeDisplay = document.getElementById('size-val-display');
        sizeSlider.addEventListener('input', (e) => {
            baseAnimalSize = parseInt(e.target.value);
            if (baseAnimalSize < 35) sizeDisplay.innerText = '작게';
            else if (baseAnimalSize < 65) sizeDisplay.innerText = '보통';
            else sizeDisplay.innerText = '거대하게';
        });

        // Interactive Touch/Click Canvas Spawner
        let isPointerDown = false;
        function spawnAtPointer(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const x = clientX - rect.left;
            const y = clientY - rect.top;

            // Don't spawn if clicking inside control panel
            const panelRect = controlPanel.getBoundingClientRect();
            if (!controlPanel.classList.contains('translate-y-full') && clientY > panelRect.top) {
                return;
            }

            animals.push(new AnimalEntity(x, y));
            audio.playPop(0.8 + Math.random() * 0.6);
        }

        canvas.addEventListener('mousedown', (e) => {
            isPointerDown = true;
            spawnAtPointer(e);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (isPointerDown && Math.random() < 0.3) {
                spawnAtPointer(e);
            }
        });
        window.addEventListener('mouseup', () => isPointerDown = false);

        canvas.addEventListener('touchstart', (e) => {
            isPointerDown = true;
            spawnAtPointer(e);
        });
        canvas.addEventListener('touchmove', (e) => {
            if (isPointerDown && Math.random() < 0.4) {
                spawnAtPointer(e);
            }
        });
        window.addEventListener('touchend', () => isPointerDown = false);

        // ==========================================
        // Main Loop & Rendering
        // ==========================================
        let lastSpawnTime = performance.now();

        function animate(currentTime) {
            // Automatic Spawning Logic
            if (spawnRate > 0) {
                const spawnInterval = 1000 / spawnRate;
                if (currentTime - lastSpawnTime > spawnInterval) {
                    animals.push(new AnimalEntity());
                    lastSpawnTime = currentTime;
                }
            }

            // Cap maximum animals for performance (e.g., 600 max on screen)
            if (animals.length > 600) {
                animals.splice(0, animals.length - 600);
            }

            // Draw Background Gradient
            const currentBg = BACKGROUNDS[currentBgIndex];
            const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, currentBg.bgGradient[0]);
            bgGrad.addColorStop(0.6, currentBg.bgGradient[1]);
            bgGrad.addColorStop(1, currentBg.bgGradient[2]);

            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Ground Horizon silhouette if applicable
            if (currentBg.groundHeight < 1.0) {
                const gY = canvas.height * currentBg.groundHeight;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.beginPath();
                ctx.ellipse(canvas.width / 2, gY + 100, canvas.width * 0.8, 120, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Update & Draw Ambient Particles
            ambientParticles.forEach(p => {
                p.update();
                p.draw(ctx, currentBg.particleColor);
            });

            // Update & Draw Animals
            for (let i = 0; i < animals.length; i++) {
                animals[i].update(0.016);
                animals[i].draw(ctx);
            }

            // Update Counters Display
            document.getElementById('count-onscreen').innerText = animals.length.toLocaleString();
            document.getElementById('count-total').innerText = totalSpawnedCount.toLocaleString();

            requestAnimationFrame(animate);
        }

        // Initialize Everything
        window.onload = () => {
            initUI();
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
