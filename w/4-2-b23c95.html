<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>샥샥샥 - 차근차근 올라가는 수학 교실</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts (Friendly Math Chalk/Textbook feel) -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
            min-h: 100vh;
        }

        /* Chalkboard blackboard aesthetic panel */
        .chalkboard {
            background: #1e293b;
            border: 8px solid #854d0e;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 1.5rem;
            position: relative;
        }

        .chalkboard::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 80%);
            pointer-events: none;
            border-radius: 1rem;
        }

        .math-font {
            font-family: 'Gaegu', cursive, sans-serif;
        }

        /* Shaking animation on wrong answer */
        @keyframes shakeErr {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake-effect {
            animation: shakeErr 0.4s ease-in-out;
        }

        /* Slash effect when answering correctly "샥!" */
        @keyframes slashAnim {
            0% { opacity: 0; transform: scale(0.5) rotate(-20deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(10deg); }
            100% { opacity: 0; transform: scale(1.5) rotate(25deg); }
        }
        .slash-pop {
            animation: slashAnim 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 4px;
        }
    </style>
</head>

    </main>

                id: 'unit5',
                title: '5. 확률과 통계',
                desc: '경우의 수와 평균 계산',
                icon: '🎲',
                problems: [
                    { level: 1, tag: "기초", q: "주사위 1개를 던질 때, 홀수가 나올 경우의 수는?", opts: ["1가지", "2가지", "3가지", "6가지"], ans: 2, hint: "주사위의 홀수는 1, 3, 5 세 가지가 있어!" },
                    { level: 2, tag: "기초", q: "동전 1개를 던질 때 앞면이 나올 확률은?", opts: ["1/4", "1/2", "1/3", "1"], ans: 1, hint: "전체 경우(앞,뒤 2가지) 중 앞면은 1가지!" },
                    { level: 3, tag: "기본", q: "수학 점수 80점, 90점, 100점의 평균은?", opts: ["85점", "90점", "95점", "100점"], ans: 1, hint: "다 더해서(270) 개수(3)로 나누면 돼!" },
                    { level: 4, tag: "기본", q: "주사위 1개를 던져 4 이하가 나올 확률은?", opts: ["1/2", "2/3", "1/3", "5/6"], ans: 1, hint: "1, 2, 3, 4 총 4가지 -> 4/6 약분하면 2/3!" },
                    { level: 5, tag: "응용", q: "동전 2개를 동시에 던질 때 둘 다 앞면일 확률은?", opts: ["1/2", "1/3", "1/4", "1/8"], ans: 2, hint: "전체 4가지 (앞앞, 앞뒤, 뒤앞, 뒤뒤) 중 (앞앞) 1가지!" },
                    { level: 6, tag: "응용", q: "4명의 학생 중 대표 2명을 뽑는 경우의 수는?", opts: ["4가지", "6가지", "8가지", "12가지"], ans: 1, hint: "(4 × 3) ÷ 2 = 6가지!" },
                    { level: 7, tag: "심화 진입", q: "주사위 2개를 던져 눈의 합이 7이 되는 경우의 수는?", opts: ["4가지", "5가지", "6가지", "7가지"], ans: 2, hint: "(1,6), (2,5), (3,4), (4,3), (5,2), (6,1) 6가지!" },
                    { level: 8, tag: "심화", q: "5명의 시험 평균이 80점일 때, 총점은 몇 점일까?", opts: ["380점", "400점", "420점", "450점"], ans: 1, hint: "총점 = 평균 × 명수 = 80 × 5" },
                    { level: 9, tag: "고난도", q: "윷놀이에서 윷을 던졌을 때 '개'가 나올 확률은?", opts: ["1/16", "4/16", "6/16", "8/16"], ans: 2, hint: "등 2개, 배 2개 나오는 경우 = 4C2 / 2⁴ = 6/16 = 3/8" },
                    { level: 10, tag: "🔥 최상위 마스터", q: "남학생 3명, 여학생 2명을 한 줄로 세울 때 여학생끼리 이웃할 확률은?", opts: ["1/5", "2/5", "3/5", "1/2"], ans: 1, hint: "여학생 2명을 1명으로 묶어서 계산하면 4! × 2! / 5! = 2/5" }
                ]
            },
            {
                id: 'unit6',
                title: '6. 이차방정식과 함수',
                desc: '중고등 수학의 핵심 도전',
                icon: '📈',
                problems: [
                    { level: 1, tag: "기초", q: "y = 2x + 1 일 때, x = 3 이면 y = ?", opts: ["5", "6", "7", "8"], ans: 2, hint: "x에 3을 넣어서 계산해봐! 2×3 + 1" },
                    { level: 2, tag: "기초", q: "x² = 16 (x > 0) 일 때 x의 값은?", opts: ["2", "3", "4", "8"], ans: 2, hint: "같은 수를 두 번 곱해서 16이 되는 양수는?" },
                    { level: 3, tag: "기본", q: "일차함수 y = -3x + 6의 x절편은?", opts: ["2", "3", "-2", "6"], ans: 0, hint: "y = 0 일 때의 x값을 구하면 돼! 0 = -3x + 6" },
                    { level: 4, tag: "기본", q: "x² - 5x + 6 = 0 의 두 근의 합은?", opts: ["5", "-5", "6", "-6"], ans: 0, hint: "근과 계수와의 관계: 두 근의 합 = -b/a = -(-5)/1 = 5" },
                    { level: 5, tag: "응용", q: "(x - 2)(x - 4) = 0 의 두 해 x는?", opts: ["2 또는 4", "-2 또는 -4", "2 또는 -4", "6"], ans: 0, hint: "각 괄호가 0이 되는 x의 값을 찾으렴!" },
                    { level: 6, tag: "응용", q: "이차함수 y = (x - 3)² + 2 의 꼭짓점 좌표는?", opts: ["(3, 2)", "(-3, 2)", "(3, -2)", "(0, 2)"], ans: 0, hint: "표준형 y = (x - p)² + q 에서 꼭짓점은 (p, q)" },
                    { level: 7, tag: "심화 진입", q: "x² - 9 = 0 의 양수해 x = ?", opts: ["3", "9", "-3", "81"], ans: 0, hint: "x² = 9 이므로 제곱해서 9가 되는 양수는 3!" },
                    { level: 8, tag: "심화", q: "x² + 4x + 4 = 0 의 해(중근)는?", opts: ["x = 2", "x = -2", "x = 4", "x = -4"], ans: 1, hint: "(x + 2)² = 0 이므로 x = -2!" },
                    { level: 9, tag: "고난도", q: "y = x² - 4x + 5 의 최솟값은?", opts: ["1", "2", "3", "5"], ans: 0, hint: "y = (x - 2)² + 1 로 변형하면 최솟값은 1!" },
                    { level: 10, tag: "🔥 최상위 마스터", q: "x² - 2x - 1 = 0 의 근의 공식 해 중 양수는?", opts: ["1 + √2", "1 + √3", "2 + √2", "√2"], ans: 0, hint: "x = [-b ± √(b² - 4ac)] / 2a = [2 ± √(4+4)]/2 = 1 ± √2" }
                ]
            }
        ];

        // APP STATE
        let currentUnitIndex = 0;
        let currentLevelIndex = 0; // 0 to 9 (Level 1 to 10)
        let comboStreak = 0;
        let totalStars = 0;
        let hintUnlocked = false;

        // Web Audio Synthesizer for sound effects
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'correct') {
                // Happy high pop slash chime
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.25); // C6

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                // Low wrong buzz
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.3);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'levelUp') {
                // Fanfare sound
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);

                    gain.gain.setValueAtTime(0.15, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.35);
                });
            }
        }

        function renderUnitList() {
            const container = document.getElementById('unit-list');
            container.innerHTML = '';

            UNITS.forEach((unit, idx) => {
                const isSelected = idx === currentUnitIndex;
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3 rounded-xl border transition-all flex items-center justify-between ${
                    isSelected 
                    ? 'bg-amber-500/20 border-amber-400 text-amber-200 font-bold shadow-lg shadow-amber-500/10' 
                    : 'bg-slate-900/50 border-slate-700/80 text-slate-300 hover:bg-slate-800/80'
                }`;

                btn.innerHTML = `
                    <div class="flex items-center space-x-2.5">
                        <span class="text-xl">${unit.icon}</span>
                        <div>
                            <div class="text-xs font-bold">${unit.title}</div>
                            <div class="text-[10px] text-slate-400">${unit.desc}</div>
                        </div>
                    </div>
                    ${isSelected ? '<span class="text-amber-400 text-xs"><i class="fa-solid fa-chevron-right"></i></span>' : ''}
                `;

                btn.addEventListener('click', () => {
                    currentUnitIndex = idx;
                    currentLevelIndex = 0; // Reset to level 1 on unit change
                    renderUnitList();
                    loadCurrentProblem();
                });

                container.appendChild(btn);
            });
        }

        function loadCurrentProblem() {
            const unit = UNITS[currentUnitIndex];
            const prob = unit.problems[currentLevelIndex];
            hintUnlocked = false;

            // Update Titles & Level Badges
            document.getElementById('current-unit-title').innerText = unit.title;
            document.getElementById('level-num').innerText = prob.level;
            document.getElementById('problem-category-tag').innerText = prob.tag;

            // Level Progress Bar
            const percent = ((prob.level) / 10) * 100;
            document.getElementById('level-progress-bar').style.width = `${percent}%`;

            // Teacher Speech & Badge according to difficulty
            const badgeEl = document.getElementById('difficulty-badge');
            const speechEl = document.getElementById('teacher-speech');

            if (prob.level <= 3) {
                badgeEl.innerText = `${prob.level}단계: 초간단 난이도`;
                badgeEl.className = "text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2 py-0.5 rounded-full font-bold";
                speechEl.innerText = `"좋아! 1~3단계는 기본 개념이야! 가벼운 마음으로 샥샥 풀어봐!"`;
            } else if (prob.level <= 6) {
                badgeEl.innerText = `${prob.level}단계: 응용 난이도`;
                badgeEl.className = "text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full font-bold";
                speechEl.innerText = `"오호! 난이도가 점점 올라가고 있어! 방심하지 말고 실력을 보여줘!"`;
            } else if (prob.level <= 9) {
                badgeEl.innerText = `${prob.level}단계: 심화 도전`;
                badgeEl.className = "text-[10px] bg-orange-500/20 text-orange-300 border border-orange-500/40 px-2 py-0.5 rounded-full font-bold";
                speechEl.innerText = `"조금 고난도 문제야! 왼쪽 '손풀이장'에 직접 메모하면서 차근차근 계산해보렴!"`;
            } else {
                badgeEl.innerText = `10단계: 🔥 최상위 마스터`;
                badgeEl.className = "text-[10px] bg-rose-500/20 text-rose-300 border border-rose-500/40 px-2 py-0.5 rounded-full font-bold animate-pulse";
                speechEl.innerText = `"대단해! 드디어 단원의 마지막 10단계 마스터 문제야! 집중해서 샥- 맞혀보자!"`;
            }

            // Problem Text
            document.getElementById('problem-text').innerText = prob.q;

            // Reset Hint
            document.getElementById('hint-box').classList.add('hidden');
            document.getElementById('hint-text').innerText = prob.hint;

            // Options Grid
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';

            prob.opts.forEach((optText, optIdx) => {
                const optBtn = document.createElement('button');
                optBtn.className = "w-full py-3.5 px-4 bg-slate-800/90 hover:bg-amber-500/20 border-2 border-slate-600/80 hover:border-amber-400 rounded-2xl text-base sm:text-lg font-bold text-white transition transform active:scale-95 shadow-md flex items-center justify-center space-x-2";
                
                optBtn.innerHTML = `
                    <span class="w-6 h-6 rounded-full bg-slate-700 text-xs flex items-center justify-center font-bold text-slate-300">${optIdx + 1}</span>
                    <span>${optText}</span>
                `;

                optBtn.addEventListener('click', () => handleAnswerCheck(optIdx));
                grid.appendChild(optBtn);
            });
        }

        function handleAnswerCheck(selectedIndex) {
            const unit = UNITS[currentUnitIndex];
            const prob = unit.problems[currentLevelIndex];
            const board = document.getElementById('blackboard-panel');

            if (selectedIndex === prob.ans) {
                // CORRECT ANSWER!
                playSound('correct');

                // Visual Slash Pop Effect
                const slash = document.getElementById('slash-overlay');
                slash.classList.remove('opacity-0');
                setTimeout(() => slash.classList.add('opacity-0'), 600);

                // Update Score & Streak
                comboStreak++;
                totalStars += prob.level * 10;
                document.getElementById('combo-count').innerText = `${comboStreak} 콤보`;
                document.getElementById('star-count').innerText = `${totalStars}개`;

                // Progress to Next Level
                if (currentLevelIndex < 9) {
                    currentLevelIndex++;
                    setTimeout(() => {
                        loadCurrentProblem();
                    }, 500);
                } else {
                    // CHAPTER COMPLETED!
                    playSound('levelUp');
                    document.getElementById('teacher-speech').innerText = `🎉 축하해! ${unit.title}의 10단계를 모두 정복했어! 넌 수학 천재야!`;
                    setTimeout(() => {
                        // Move to next unit if available
                        if (currentUnitIndex < UNITS.length - 1) {
                            currentUnitIndex++;
                            currentLevelIndex = 0;
                            renderUnitList();
                            loadCurrentProblem();
                        } else {
                            currentLevelIndex = 0;
                            loadCurrentProblem();
                        }
                    }, 1800);
                }

            } else {
                // WRONG ANSWER
                playSound('wrong');
                comboStreak = 0;
                document.getElementById('combo-count').innerText = `0 콤보`;

                board.classList.add('shake-effect');
                setTimeout(() => board.classList.remove('shake-effect'), 400);

                document.getElementById('teacher-speech').innerText = `"아쉬워! 힌트 단추를 누르거나 손풀이장에 다시 천천히 계산해 볼까?"`;
            }
        }

        // SCRATCHPAD CANVAS LOGIC
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.strokeStyle = '#fef08a'; // Soft yellow chalk color
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDraw(e) {
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function stopDraw() {
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDraw);

        canvas.addEventListener('touchstart', startDraw);
        canvas.addEventListener('touchmove', draw);
        window.addEventListener('touchend', stopDraw);

        document.getElementById('clear-canvas-btn').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // Hint & Skip Button Handlers
        document.getElementById('hint-btn').addEventListener('click', () => {
            initAudio();
            document.getElementById('hint-box').classList.remove('hidden');
        });

        document.getElementById('skip-btn').addEventListener('click', () => {
            initAudio();
            comboStreak = 0;
            document.getElementById('combo-count').innerText = `0 콤보`;
            if (currentLevelIndex < 9) {
                currentLevelIndex++;
            } else {
                currentLevelIndex = 0;
            }
            loadCurrentProblem();
        });

        // INITIALIZATION ON LOAD
        window.onload = function() {
            resizeCanvas();
            renderUnitList();
            loadCurrentProblem();
        };

        window.onresize = function() {
            resizeCanvas();
        };
    </script>
</body>
</html>
