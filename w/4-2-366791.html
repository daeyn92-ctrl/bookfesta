<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>지우를 지켜라 - 도깨비 폰 방어 대작전</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Jua', 'Noto Sans KR', sans-serif;
            touch-action: manipulation;
        }

        body {
            background-color: #090514;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            margin: 0;
        }

        /* Pulsing Glow Effect for Jiwoo */
        @keyframes auraPulse {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(236, 72, 153, 0.6)); }
            50% { filter: drop-shadow(0 0 28px rgba(168, 85, 247, 0.9)); }
        }
        .jiwoo-glow {
            animation: auraPulse 2.5s infinite ease-in-out;
        }

        /* Banner Pop Effect */
        @keyframes bannerPop {
            0% { transform: translate(-50%, -50%) scale(0.3) rotate(-10deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.15) rotate(3deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 0; }
        }
        .no-entry-banner {
            animation: bannerPop 1.1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Custom Floating Particles */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }

        .interactive-btn {
            pointer-events: auto;
        }
    </style>
</head>
<body class="relative flex flex-col justify-between p-4 min-h-screen">

    <!-- GAME CANVAS (Renders Goblins, Shields, Beams, Effects) -->
    <canvas id="gameCanvas"></canvas>

    <!-- TOP HUD OVERLAY -->
    <header class="ui-layer w-full max-w-2xl mx-auto flex flex-col sm:flex-row justify-between items-center bg-slate-900/80 backdrop-blur-md border border-purple-500/30 p-3.5 rounded-2xl shadow-2xl space-y-2 sm:space-y-0">
        <!-- App Title & Mascot Avatar -->
        <div class="flex items-center space-x-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-pink-500 to-purple-600 p-0.5 shadow-lg shadow-pink-500/30 flex items-center justify-center text-2xl">
                👧
            </div>
            <div>
                <h1 class="text-xl font-black bg-gradient-to-r from-pink-300 via-purple-200 to-yellow-300 bg-clip-text text-transparent tracking-wide">
                    지우를 지켜라!
                </h1>
                <p class="text-[11px] text-purple-300">도깨비 폰의 기 흡수를 방어막으로 차단해!</p>
            </div>
        </div>

        <!-- Jiwoo's Ki (Energy) Bar -->
        <div class="w-full sm:w-48 bg-slate-950 p-2 rounded-xl border border-slate-800">
            <div class="flex justify-between items-center text-xs font-bold mb-1">
                <span class="text-pink-400 flex items-center"><i class="fa-solid fa-bolt mr-1"></i>지우의 기(에너지)</span>
                <span id="ki-val" class="text-amber-300 font-black">100%</span>
            </div>
            <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden p-0.5">
                <div id="ki-bar" class="bg-gradient-to-r from-pink-500 via-purple-500 to-emerald-400 h-full rounded-full transition-all duration-300 w-full"></div>
            </div>
        </div>

        <!-- Score / Repelled Goblins Count -->
        <div class="flex space-x-2 text-center">
            <div class="bg-purple-950/80 border border-purple-500/40 px-3 py-1 rounded-xl">
                <div class="text-[9px] text-purple-300 font-bold">퇴치한 도깨비</div>
                <span id="repelled-count" class="text-base font-black text-yellow-300">0마리</span>
            </div>
        </div>
    </header>

    <!-- JIWOO SPEECH DIALOGUE BUBBLE -->
    <div class="ui-layer w-full max-w-md mx-auto my-auto text-center pointer-events-none mt-2">
        <div class="inline-block bg-gradient-to-r from-purple-900/90 to-indigo-900/90 border-2 border-pink-400/60 text-pink-100 px-4 py-2.5 rounded-2xl shadow-2xl backdrop-blur-md">
            <p id="jiwoo-speech" class="text-sm font-bold tracking-wide">
                "나를 지켜줘서 고마워! 도깨비 폰에 기를 빼앗기지 않게 **방어막을 꾹 눌러줘!**"
            </p>
        </div>
    </div>

    <!-- CENTER NO ENTRY DYNAMIC BANNER (Pops when shield clicked) -->
    <div id="no-entry-modal" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50 pointer-events-none hidden">
        <div class="bg-gradient-to-r from-rose-600 via-red-500 to-amber-500 border-4 border-yellow-300 text-white px-8 py-4 rounded-3xl shadow-[0_0_50px_rgba(239,68,68,0.8)] text-2xl sm:text-4xl font-black text-center whitespace-nowrap tracking-wider no-entry-banner flex items-center space-x-3">
            <span>⛔</span>
            <span id="no-entry-text">도깨비는 출입금지!</span>
            <span>⚡</span>
        </div>
    </div>

    <!-- BOTTOM CONTROLS & ACTIVE SHIELD SELECTOR -->
    <footer class="ui-layer w-full max-w-2xl mx-auto bg-slate-900/85 border border-purple-500/30 p-3.5 rounded-2xl shadow-2xl flex flex-col sm:flex-row justify-between items-center space-y-2 sm:space-y-0">
        <!-- Current Active Shield Badge -->
        <div class="flex items-center space-x-3">
            <div id="shield-icon" class="w-11 h-11 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 text-white text-2xl flex items-center justify-center shadow-lg">
                🔥
            </div>
            <div class="text-left">
                <div class="text-[10px] text-purple-300 font-bold">현재 방어막 모드</div>
                <div id="shield-name" class="text-base font-black text-amber-300">🔥 불꽃 화염 방어막</div>
            </div>
        </div>

        <!-- MAIN ACTION: CLICK SHIELD BUTTON -->
        <button id="shield-click-btn" class="interactive-btn w-full sm:w-auto px-6 py-3.5 bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 hover:from-pink-400 hover:to-indigo-500 border-2 border-yellow-300 text-white rounded-2xl font-black text-base shadow-lg shadow-pink-500/40 active:scale-95 transition transform flex items-center justify-center space-x-2">
            <i class="fa-solid fa-shield-halved text-yellow-300 text-lg"></i>
            <span>방어막 바꾸기 & 충격파 터뜨리기!</span>
        </button>
    </footer>

    <script>
        // SHIELD TYPES DATA (7 Unique Magical Barrier Elements)
        const SHIELD_TYPES = [
            {
                id: 'flame',
                name: '🔥 불꽃 화염 방어막',
                icon: '🔥',
                color: '#f97316',
                glow: 'rgba(249, 115, 22, 0.8)',
                desc: '"화염 불꽃으로 도깨비 접근 차단!"',
                voice: '불꽃 방어막! 도깨비는 출입금지!'
            },
            {
                id: 'thunder',
                name: '⚡ 뇌전 번개 방어막',
                icon: '⚡',
                color: '#eab308',
                glow: 'rgba(234, 179, 8, 0.8)',
                desc: '"찌릿찌릿 뇌전 충격파로 물리치기!"',
                voice: '뇌전 번개 방어막! 도깨비는 출입금지!'
            },
            {
                id: 'frost',
                name: '❄️ 얼음 빙결 방어막',
                icon: '❄️',
                color: '#38bdf8',
                glow: 'rgba(56, 189, 248, 0.8)',
                desc: '"차가운 얼음 벽으로 도깨비 동결!"',
                voice: '얼음 방어막! 도깨비는 출입금지!'
            },
            {
                id: 'nature',
                name: '🌿 생명 자연 방어막',
                icon: '🌿',
                color: '#22c55e',
                glow: 'rgba(34, 197, 94, 0.8)',
                desc: '"푸른 생명의 빛으로 기 정화!"',
                voice: '자연 방어막! 도깨비는 출입금지!'
            },
            {
                id: 'love',
                name: '💖 핑크 하트 방어막',
                icon: '💖',
                color: '#ec4899',
                glow: 'rgba(236, 72, 153, 0.8)',
                desc: '"사랑의 핑크 빛으로 도깨비 유턴!"',
                voice: '하트 방어막! 도깨비는 출입금지!'
            },
            {
                id: 'cosmic',
                name: '🌌 갤럭시 우주 방어막',
                icon: '🌌',
                color: '#a855f7',
                glow: 'rgba(168, 85, 247, 0.8)',
                desc: '"신비한 우주 파동으로 광범위 밀쳐내기!"',
                voice: '우주 방어막! 도깨비는 출입금지!'
            },
            {
                id: 'holy',
                name: '🔱 성스러운 정화 방어막',
                icon: '🔱',
                color: '#facc15',
                glow: 'rgba(250, 204, 21, 0.9)',
                desc: '"황금빛 절대 수호 방어벽!"',
                voice: '성스러운 방어막! 도깨비는 출입금지!'
            }
        ];

        let currentShieldIdx = 0;
        let jiwooKi = 100;
        let repelledCount = 0;
        let isGameOver = false;

        // CANVAS & CONTEXT
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // CENTER JIWOO POSITION & SHIELD RADIUS
        let jiwooPos = { x: width / 2, y: height / 2 + 30 };
        let shieldRadius = 90;

        // GAME OBJECT ARRAYS
        let goblins = [];
        let particles = [];
        let shockwaves = [];
        let floatTexts = [];

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Play Sound FX (Shockwave, Zap, Damage)
        function playSound(type) {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'shockwave') {
                // Energetic Blast Sound
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.35);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'repel') {
                // Goblin Repelled Pop
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'drain') {
                // Ki Drain Low Buzz
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.2);

                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // Voice Synthesizer ("도깨비는 출입금지!")
        function speakNoEntry() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop ongoing speech
                const utterance = new SpeechSynthesisUtterance("도깨비는 출입금지!");
                utterance.lang = 'ko-KR';
                utterance.rate = 1.2;
                utterance.pitch = 1.3;
                window.speechSynthesis.speak(utterance);
            }
        }

        class Goblin {
            constructor() {
                // Spawn randomly outside screen edges
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.max(width, height) / 2 + 100;
                this.x = jiwooPos.x + Math.cos(angle) * distance;
                this.y = jiwooPos.y + Math.sin(angle) * distance;

                this.type = Math.random() < 0.2 ? 'king' : (Math.random() < 0.4 ? 'fast' : 'normal');
                
                if (this.type === 'king') {
                    this.speed = 0.8 + Math.random() * 0.4;
                    this.size = 36;
                    this.hp = 3;
                    this.color = '#dc2626'; // Red King Dokkaebi
                    this.emoji = '👹';
                } else if (this.type === 'fast') {
                    this.speed = 2.2 + Math.random() * 0.8;
                    this.size = 22;
                    this.hp = 1;
                    this.color = '#a855f7'; // Purple Speed Dokkaebi
                    this.emoji = '👾';
                } else {
                    this.speed = 1.3 + Math.random() * 0.5;
                    this.size = 26;
                    this.hp = 1;
                    this.color = '#16a34a'; // Green Dokkaebi
                    this.emoji = '👺';
                }

                this.isDraining = false;
            }

            update() {
                const dx = jiwooPos.x - this.x;
                const dy = jiwooPos.y - this.y;
                const dist = Math.hypot(dx, dy);

                // Move toward Jiwoo
                if (dist > shieldRadius - 10) {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                    this.isDraining = false;
                } else {
                    // Reached Jiwoo's energy zone: Draining Ki!
                    this.isDraining = true;
                    if (Math.random() < 0.15) {
                        jiwooKi = Math.max(0, jiwooKi - 0.5);
                        updateKiUI();
                        playSound('drain');
                        createParticles(this.x, this.y, '#ef4444', 2);
                    }
                }
            }

            draw() {
                // Draw Dokkaebi Phone Beam if draining
                if (this.isDraining) {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(239, 68, 68, 0.7)';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(jiwooPos.x, jiwooPos.y);
                    ctx.stroke();
                    ctx.restore();
                }

                // Draw Goblin Emoji Avatar
                ctx.font = `${this.size * 1.5}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.emoji, this.x, this.y);

                // Draw Dokkaebi Phone in hand
                ctx.font = `${this.size * 0.7}px sans-serif`;
                ctx.fillText('📱', this.x + 14, this.y - 12);
            }
        }

        // SHOCKWAVE CLASS (Triggered on Shield Click)
        class Shockwave {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = shieldRadius;
                this.maxRadius = Math.max(width, height) * 0.65;
                this.color = color;
                this.alpha = 1;
            }

            update() {
                this.radius += 24;
                this.alpha -= 0.035;
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.lineWidth = 14;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 20;
                ctx.stroke();
                ctx.restore();
            }
        }

        function changeShieldAndTrigger() {
            initAudio();

            // Cycle Shield Index
            currentShieldIdx = (currentShieldIdx + 1) % SHIELD_TYPES.length;
            const shield = SHIELD_TYPES[currentShieldIdx];

            // Update UI
            document.getElementById('shield-icon').innerText = shield.icon;
            document.getElementById('shield-name').innerText = shield.name;
            document.getElementById('jiwoo-speech').innerText = `"${shield.desc} **도깨비들아 물러가라!**"`;

            // Trigger Voice & Sound FX
            speakNoEntry();
            playSound('shockwave');

            // Spawn Big Shockwave
            shockwaves.push(new Shockwave(jiwooPos.x, jiwooPos.y, shield.color));

            // Show Floating "도깨비는 출입금지!" Banner Pop
            const modal = document.getElementById('no-entry-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 1000);

            // Repel Goblins & Apply Damage/Knockback
            goblins.forEach((goblin, idx) => {
                const dx = goblin.x - jiwooPos.x;
                const dy = goblin.y - jiwooPos.y;
                const dist = Math.hypot(dx, dy) || 1;

                // Push far back
                const pushDist = 350 + Math.random() * 150;
                goblin.x += (dx / dist) * pushDist;
                goblin.y += (dy / dist) * pushDist;

                goblin.hp--;

                // Create Particle Burst
                createParticles(goblin.x, goblin.y, shield.color, 12);

                if (goblin.hp <= 0) {
                    repelledCount++;
                    document.getElementById('repelled-count').innerText = `${repelledCount}마리`;
                    playSound('repel');
                }
            });

            // Filter dead goblins
            goblins = goblins.filter(g => g.hp > 0);

            // Spawn Particles Around Jiwoo
            createParticles(jiwooPos.x, jiwooPos.y, shield.color, 30);
        }

        // PARTICLE SYSTEM
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 6;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    color: color,
                    size: 3 + Math.random() * 5
                });
            }
        }

        function updateKiUI() {
            document.getElementById('ki-val').innerText = `${Math.ceil(jiwooKi)}%`;
            const bar = document.getElementById('ki-bar');
            bar.style.width = `${jiwooKi}%`;

            if (jiwooKi <= 0 && !isGameOver) {
                isGameOver = true;
                document.getElementById('jiwoo-speech').innerText = `"앗! 도깨비 폰에 기를 빼앗겼어! 다시 방어막 버튼을 눌러 부활하자!"`;
            }
        }

        function renderJiwooAndShield() {
            const shield = SHIELD_TYPES[currentShieldIdx];

            // 1. Draw Magical Shield Barrier Dome
            ctx.save();
            ctx.beginPath();
            ctx.arc(jiwooPos.x, jiwooPos.y, shieldRadius, 0, Math.PI * 2);
            ctx.fillStyle = shield.glow.replace('0.8', '0.15');
            ctx.fill();

            ctx.lineWidth = 6;
            ctx.strokeStyle = shield.color;
            ctx.shadowColor = shield.color;
            ctx.shadowBlur = 25;
            ctx.stroke();

            // Inner Pulsing Ring
            ctx.beginPath();
            ctx.arc(jiwooPos.x, jiwooPos.y, shieldRadius - 12, 0, Math.PI * 2);
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.stroke();
            ctx.restore();

            // 2. Draw Jiwoo Avatar Character
            ctx.save();
            ctx.font = '64px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            // Pulsing Ki Aura
            ctx.shadowColor = '#ec4899';
            ctx.shadowBlur = 20;
            ctx.fillText('👧', jiwooPos.x, jiwooPos.y - 5);

            // Floating Shield Element Orbs around Jiwoo
            const time = Date.now() * 0.003;
            for (let i = 0; i < 3; i++) {
                const orbAngle = time + (i * Math.PI * 2 / 3);
                const orbX = jiwooPos.x + Math.cos(orbAngle) * (shieldRadius + 8);
                const orbY = jiwooPos.y + Math.sin(orbAngle) * (shieldRadius + 8);
                ctx.font = '22px sans-serif';
                ctx.fillText(shield.icon, orbX, orbY);
            }
            ctx.restore();
        }

        // MAIN GAME ANIMATION LOOP
        function gameLoop() {
            // Clear Canvas
            ctx.fillStyle = '#090514';
            ctx.fillRect(0, 0, width, height);

            // Draw Background Mystical Runes Grid
            ctx.strokeStyle = 'rgba(168, 85, 247, 0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x < width; x += 60) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += 60) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            // Spawn Goblins Continuously
            if (!isGameOver && Math.random() < 0.04) {
                if (goblins.length < 25) {
                    goblins.push(new Goblin());
                }
            }

            // Update & Draw Goblins
            goblins.forEach(goblin => {
                goblin.update();
                goblin.draw();
            });

            // Update & Draw Shockwaves
            shockwaves.forEach((sw, index) => {
                sw.update();
                sw.draw();
                if (sw.alpha <= 0) shockwaves.splice(index, 1);
            });

            // Update & Draw Particles
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;

                ctx.save();
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (p.life <= 0) particles.splice(index, 1);
            });

            // Draw Center Jiwoo & Barrier
            renderJiwooAndShield();

            requestAnimationFrame(gameLoop);
        }

        document.getElementById('shield-click-btn').addEventListener('click', () => {
            if (isGameOver) {
                // Reset Game
                isGameOver = false;
                jiwooKi = 100;
                goblins = [];
                updateKiUI();
            }
            changeShieldAndTrigger();
        });

        // Click anywhere on shield area in canvas
        canvas.addEventListener('click', (e) => {
            const dx = e.clientX - jiwooPos.x;
            const dy = e.clientY - jiwooPos.y;
            const dist = Math.hypot(dx, dy);

            // Click within or near shield
            if (dist <= shieldRadius + 50) {
                if (isGameOver) {
                    isGameOver = false;
                    jiwooKi = 100;
                    goblins = [];
                    updateKiUI();
                }
                changeShieldAndTrigger();
            }
        });

        // Resize Canvas Adaptively
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            jiwooPos = { x: width / 2, y: height / 2 + 30 };
        });

        // INITIALIZE ON LOAD
        window.onload = function() {
            gameLoop();
        };
    </script>
</body>
</html>
