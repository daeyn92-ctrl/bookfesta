<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>천사 vs 악마: 혼돈의 냥터치 🐾👼😈</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            jua: ['"Jua"', 'sans-serif'],
            sans: ['"Noto Sans KR"', 'sans-serif']
          },
          colors: {
            cat: {
              main: '#ffb703',
              dark: '#fb8500',
              pink: '#ffb7b2'
            },
            angel: {
              light: '#fef08a',
              glow: '#38bdf8',
              gold: '#facc15'
            },
            devil: {
              main: '#c084fc',
              dark: '#e11d48',
              glow: '#a855f7'
            }
          }
        }
      }
    }
  </script>

  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(circle at center, #181825 0%, #09090e 100%);
      color: #f3f4f6;
      font-family: 'Jua', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Glass Effect Panels */
    .glass-box {
      background: rgba(23, 23, 35, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Floating Entities Base */
    .spawn-entity {
      position: absolute;
      transform: translate(-50%, -50%) scale(0);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      cursor: pointer;
      z-index: 20;
    }

    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 0; }
      70% { transform: translate(-50%, -50%) scale(1.2) rotate(10deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    }

    /* Angel Floating Aura */
    .angel-aura {
      filter: drop-shadow(0 0 18px rgba(56, 189, 248, 0.85));
      animation: angelFloat 2.5s infinite ease-in-out alternate;
    }

    @keyframes angelFloat {
      0% { transform: translate(-50%, -50%) translateY(0px) scale(1); }
      100% { transform: translate(-50%, -50%) translateY(-12px) scale(1.05); }
    }

    /* Devil Shaking Glow */
    .devil-aura {
      filter: drop-shadow(0 0 18px rgba(225, 29, 72, 0.85));
      animation: devilShake 1.8s infinite ease-in-out alternate;
    }

    @keyframes devilShake {
      0% { transform: translate(-50%, -50%) rotate(-3deg) scale(1); }
      100% { transform: translate(-50%, -50%) rotate(3deg) scale(1.08); }
    }

    /* Floating Score Floating Text */
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
      50% { transform: translate(-50%, -35px) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -60px) scale(1); }
    }

    .float-text {
      position: absolute;
      animation: floatUp 0.8s forwards ease-out;
      pointer-events: none;
      z-index: 50;
      font-family: 'Jua', sans-serif;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }

    /* Ripple Effect */
    @keyframes ripple {
      0% { transform: scale(0.2); opacity: 0.9; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    .touch-ripple {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: ripple 0.5s ease-out forwards;
      z-index: 10;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between h-screen w-screen relative overflow-hidden select-none">

  <!-- TOP HEADER & CAT DEV STATUS -->
  <header class="w-full max-w-md px-4 pt-3 pb-2 fixed top-2 z-40">
    <div class="glass-box rounded-3xl p-3 shadow-2xl flex flex-col gap-2">
      
      <div class="flex items-center justify-between">
        <!-- Cat Developer Identity -->
        <div class="flex items-center space-x-2">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-400 to-orange-500 p-0.5 flex items-center justify-center shadow-lg animate-bounce">
            <span class="text-2xl">🐾</span>
          </div>
          <div>
            <h1 class="text-base font-black text-amber-300 flex items-center gap-1">
              개발묘 야옹이 <span class="text-xs text-neutral-400 font-sans">(v1.0)</span>
            </h1>
            <p id="cat-speech" class="text-xs text-amber-100/90 font-sans font-medium">
              "화면 아무데나 터치해라냥! 천사랑 악마가 나온다냥~"
            </p>
          </div>
        </div>

        <!-- Mute Sound Switcher -->
        <button id="btn-sound" onclick="toggleSound()" class="w-9 h-9 rounded-2xl bg-slate-800/80 border border-amber-400/30 flex items-center justify-center text-amber-300 hover:text-white active:scale-95 transition-all">
          <i id="sound-icon" class="fa-solid fa-volume-high text-sm"></i>
        </button>
      </div>

      <!-- Current Game Aura Status Bar -->
      <div class="flex items-center justify-between bg-black/40 px-3 py-1.5 rounded-2xl border border-white/10 text-xs">
        <div class="flex items-center gap-1.5">
          <span id="aura-icon" class="text-base">🎲</span>
          <span id="aura-name" class="font-bold text-cyan-300">운명의 기운: 혼돈의 랜덤</span>
        </div>
        <span id="aura-timer" class="text-[11px] font-mono text-amber-400 font-bold">10s</span>
      </div>

      <!-- Score & Counts -->
      <div class="grid grid-cols-3 gap-2 text-center text-xs">
        <div class="bg-blue-950/60 p-1.5 rounded-xl border border-sky-400/30">
          <span class="text-sky-300 block text-[10px]">👼 천사 수</span>
          <span id="cnt-angel" class="text-base font-black text-sky-200">0</span>
        </div>
        <div class="bg-purple-950/60 p-1.5 rounded-xl border border-purple-400/30">
          <span class="text-purple-300 block text-[10px]">😈 악마 수</span>
          <span id="cnt-devil" class="text-base font-black text-purple-200">0</span>
        </div>
        <div class="bg-amber-950/60 p-1.5 rounded-xl border border-amber-400/30">
          <span class="text-amber-300 block text-[10px]">⭐ 냥포인트</span>
          <span id="cnt-score" class="text-base font-black text-amber-200">0</span>
        </div>
      </div>

    </div>
  </header>

  <!-- MAIN TOUCH INTERACTION ARENA -->
  <main id="touch-arena" class="w-full h-full relative cursor-pointer overflow-hidden z-10" onclick="handleArenaTouch(event)">
    <!-- Canvas for Particle Background -->
    <canvas id="bgCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- Floating Text Layer -->
    <div id="float-layer" class="absolute inset-0 pointer-events-none z-30"></div>

    <!-- Center Tap Prompt -->
    <div id="tap-prompt" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center pointer-events-none opacity-80 transition-opacity duration-500">
      <div class="text-6xl animate-pulse mb-2">🐾</div>
      <p class="text-lg font-black text-amber-200 drop-shadow-md">화면을 막 터치해보라냥!</p>
      <p class="text-xs text-neutral-400 font-sans">천사와 악마가 신기한 비율로 튀어나온다냥~</p>
    </div>
  </main>

  <!-- BOTTOM CAT SKILL ACTION DECK -->
  <footer class="w-full max-w-md px-4 pb-4 fixed bottom-2 z-40">
    <div class="glass-box rounded-3xl p-2.5 shadow-2xl">
      <div class="grid grid-cols-3 gap-2">
        
        <!-- Skill 1: Cat Paw Blast (Purify all Devils) -->
        <button 
          onclick="useCatPawSkill()" 
          class="p-2 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-400 hover:brightness-110 active:scale-95 transition-all text-slate-950 font-black text-xs flex flex-col items-center justify-center gap-0.5 shadow-lg border border-amber-200"
        >
          <span class="text-lg">🐾 야옹 펀치</span>
          <span class="text-[10px] text-slate-900 font-sans font-bold">악마 정화 (-30 Pt)</span>
        </button>

        <!-- Skill 2: Angel Grace Blessing (Force Angel Aura) -->
        <button 
          onclick="triggerAngelAura()" 
          class="p-2 rounded-2xl bg-gradient-to-tr from-sky-400 to-blue-600 hover:brightness-110 active:scale-95 transition-all text-white font-black text-xs flex flex-col items-center justify-center gap-0.5 shadow-lg border border-sky-200"
        >
          <span class="text-lg">👼 천사 강림</span>
          <span class="text-[10px] text-sky-100 font-sans font-bold">천사 폭발 (-50 Pt)</span>
        </button>

        <!-- Skill 3: Clear Arena -->
        <button 
          onclick="clearArena()" 
          class="p-2 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 hover:brightness-110 active:scale-95 transition-all text-white font-black text-xs flex flex-col items-center justify-center gap-0.5 shadow-lg border border-purple-200"
        >
          <span class="text-lg">🧹 대청소</span>
          <span class="text-[10px] text-purple-100 font-sans font-bold">화면 비우기</span>
        </button>

      </div>
    </div>
  </footer>

  <script>
    /* ===================================================================
       1. CAT DEV AUDIO SYNTHESIZER (Web Audio API)
       =================================================================== */
    let soundEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'cat_meow') {
          // Cute Cat Meow Sound Pitch Ramp
          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(750, now + 0.15);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.3);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'angel_pop') {
          // Soft Heavenly Chime Ring
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(880, now); // A5
          osc.frequency.setValueAtTime(1318.5, now + 0.08); // E6
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'devil_pop') {
          // Dark Low Synth Pluck
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'special_pop') {
          // Golden Sparkle Sound
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
          osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
          osc.frequency.setValueAtTime(1046.5, now + 0.24); // C6
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
          osc.start(now);
          osc.stop(now + 0.4);
        } else if (type === 'purify') {
          // Magic Blast Sweep
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(1200, now + 0.25);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
          osc.start(now);
          osc.stop(now + 0.28);
        }
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-icon').className = soundEnabled 
        ? 'fa-solid fa-volume-high text-sm' 
        : 'fa-solid fa-volume-xmark text-sm text-rose-400';
    }

    /* ===================================================================
       2. UNPREDICTABLE RANDOM PROBABILITY ENGINE (운명의 기운 시스템)
       =================================================================== */
    // Dynamic Auras that alter touch probabilities unpredictably
    const AURAS = [
      { id: 'chaos', name: '혼돈의 랜덤 (50:50)', icon: '🎲', angelProb: 0.48, devilProb: 0.48, specialProb: 0.04, color: 'text-cyan-300' },
      { id: 'angel_blessing', name: '천사 강림 축복 (천사 85%)', icon: '✨', angelProb: 0.85, devilProb: 0.10, specialProb: 0.05, color: 'text-sky-300' },
      { id: 'devil_frenzy', name: '악마 광란 타임 (악마 85%)', icon: '🔥', angelProb: 0.10, devilProb: 0.85, specialProb: 0.05, color: 'text-purple-300' },
      { id: 'cat_grace', name: '고양이 황금 은혜 (특수 30%)', icon: '👑', angelProb: 0.35, devilProb: 0.35, specialProb: 0.30, color: 'text-amber-300' },
      { id: 'trickster', name: '장난꾸러기 기운 (퐁당퐁당)', icon: '🃏', angelProb: 0.50, devilProb: 0.50, specialProb: 0.00, color: 'text-rose-300' }
    ];

    let currentAura = AURAS[0];
    let auraTimeLeft = 10;
    let auraInterval = null;

    let gameState = {
      angelCount: 0,
      devilCount: 0,
      score: 0,
      totalTaps: 0,
      lastEntityWasAngel: false
    };

    const CAT_SPEECHES = [
      "야옹~! 천사랑 악마 비율이 계속 변한다냥!",
      "악마가 너무 많으면 야옹 펀치로 날려버려라냥!",
      "천사는 냥포인트를 주고 악마를 정화해준다냥~",
      "골드 고양이 천사가 나오면 대박이다냥! 🐾",
      "톡톡 신나게 터치해라냥~ 냥냥!"
    ];

    function startAuraEngine() {
      if (auraInterval) clearInterval(auraInterval);

      auraInterval = setInterval(() => {
        auraTimeLeft--;
        document.getElementById('aura-timer').innerText = `${auraTimeLeft}s`;

        if (auraTimeLeft <= 0) {
          switchRandomAura();
          auraTimeLeft = 10;
        }
      }, 1000);
    }

    function switchRandomAura(forcedAuraId = null) {
      if (forcedAuraId) {
        currentAura = AURAS.find(a => a.id === forcedAuraId) || AURAS[0];
      } else {
        // Pick a new random aura different from current
        const nextCandidates = AURAS.filter(a => a.id !== currentAura.id);
        currentAura = nextCandidates[Math.floor(Math.random() * nextCandidates.length)];
      }

      document.getElementById('aura-icon').innerText = currentAura.icon;
      document.getElementById('aura-name').innerText = `운명의 기운: ${currentAura.name}`;
      document.getElementById('aura-name').className = `font-bold ${currentAura.color}`;
      
      // Update Cat Dev Comment
      const randomMsg = CAT_SPEECHES[Math.floor(Math.random() * CAT_SPEECHES.length)];
      document.getElementById('cat-speech').innerText = `"${randomMsg}"`;
      
      playSound('cat_meow');
    }

    /* ===================================================================
       3. ENTITY DEFINITIONS & TOUCH SPAWN ENGINE
       =================================================================== */
    const ANGEL_TYPES = [
      { emoji: '👼', name: '아기 천사', pts: 10, class: 'angel-aura' },
      { emoji: '😇', name: '미소 천사', pts: 15, class: 'angel-aura' },
      { emoji: '🕊️', name: '평화의 비둘기', pts: 20, class: 'angel-aura' },
      { emoji: '🌟', name: '별빛 수호신', pts: 25, class: 'angel-aura' }
    ];

    const DEVIL_TYPES = [
      { emoji: '😈', name: '장난 악마', pts: -5, class: 'devil-aura' },
      { emoji: '👿', name: '불꽃 악마', pts: -10, class: 'devil-aura' },
      { emoji: '💀', name: '해골 데빌', pts: -15, class: 'devil-aura' },
      { emoji: '👾', name: '픽셀 악마', pts: -8, class: 'devil-aura' }
    ];

    const SPECIAL_TYPES = [
      { emoji: '🐱👼', name: '황금 고양이 천사', pts: 100, class: 'angel-aura' },
      { emoji: '👑🐾', name: '수호신 냥이', pts: 150, class: 'angel-aura' }
    ];

    function handleArenaTouch(event) {
      // Hide initial tap prompt text
      const prompt = document.getElementById('tap-prompt');
      if (prompt) prompt.style.opacity = '0';

      const arena = document.getElementById('touch-arena');
      const rect = arena.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      spawnTouchRipple(x, y);

      // Determine entity type using Variable Probability Engine
      const roll = Math.random();
      gameState.totalTaps++;

      let spawnCategory = 'angel';

      if (currentAura.id === 'trickster') {
        // Alternates predictably in trickster mode!
        spawnCategory = gameState.lastEntityWasAngel ? 'devil' : 'angel';
      } else {
        if (roll < currentAura.specialProb) {
          spawnCategory = 'special';
        } else if (roll < currentAura.specialProb + currentAura.angelProb) {
          spawnCategory = 'angel';
        } else {
          spawnCategory = 'devil';
        }
      }

      spawnEntityAt(x, y, spawnCategory);
    }

    function spawnTouchRipple(x, y) {
      const arena = document.getElementById('touch-arena');
      const ripple = document.createElement('div');
      ripple.className = 'touch-ripple bg-amber-300/30 w-16 h-16';
      ripple.style.left = `${x - 32}px`;
      ripple.style.top = `${y - 32}px`;
      arena.appendChild(ripple);
      setTimeout(() => ripple.remove(), 500);
    }

    function spawnEntityAt(x, y, category) {
      const arena = document.getElementById('touch-arena');
      const el = document.createElement('div');

      let entityData;
      if (category === 'angel') {
        entityData = ANGEL_TYPES[Math.floor(Math.random() * ANGEL_TYPES.length)];
        gameState.angelCount++;
        gameState.score += entityData.pts;
        gameState.lastEntityWasAngel = true;
        playSound('angel_pop');
        spawnFloatingText(x, y, `+${entityData.pts} ${entityData.name}`, 'text-sky-300');
      } else if (category === 'devil') {
        entityData = DEVIL_TYPES[Math.floor(Math.random() * DEVIL_TYPES.length)];
        gameState.devilCount++;
        gameState.score = Math.max(0, gameState.score + entityData.pts);
        gameState.lastEntityWasAngel = false;
        playSound('devil_pop');
        spawnFloatingText(x, y, `${entityData.pts} ${entityData.name}`, 'text-purple-300');
      } else { // Special Golden Cat Angel
        entityData = SPECIAL_TYPES[Math.floor(Math.random() * SPECIAL_TYPES.length)];
        gameState.angelCount += 2;
        gameState.score += entityData.pts;
        gameState.lastEntityWasAngel = true;
        playSound('special_pop');
        confetti({ particleCount: 30, spread: 50, origin: { x: x / window.innerWidth, y: y / window.innerHeight } });
        spawnFloatingText(x, y, `⭐ 대박! +${entityData.pts}`, 'text-amber-300 font-extrabold text-lg');
      }

      el.className = `spawn-entity ${entityData.class} text-4xl sm:text-5xl select-none`;
      el.innerText = entityData.emoji;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;

      // Interactive Click on spawned entity to Purify/Collect!
      el.onclick = (e) => {
        e.stopPropagation(); // prevent spawning another on same spot
        if (category === 'devil') {
          // Purify Devil into Angel!
          playSound('purify');
          el.innerText = '👼';
          el.className = 'spawn-entity angel-aura text-4xl sm:text-5xl';
          gameState.devilCount = Math.max(0, gameState.devilCount - 1);
          gameState.angelCount++;
          gameState.score += 25;
          spawnFloatingText(x, y, '✨ 정화 성공! +25', 'text-amber-300');
          updateUI();
        } else {
          // Collect Angel for extra score
          playSound('angel_pop');
          gameState.score += 5;
          spawnFloatingText(x, y, '✨ 수집! +5', 'text-sky-200');
          el.remove();
          updateUI();
        }
      };

      arena.appendChild(el);
      updateUI();
    }

    function spawnFloatingText(x, y, text, colorClass = 'text-amber-300') {
      const layer = document.getElementById('float-layer');
      const el = document.createElement('div');
      el.className = `float-text text-sm sm:text-base font-black ${colorClass}`;
      el.innerText = text;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;

      layer.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    /* ===================================================================
       4. CAT SKILLS & ARENA ACTIONS
       =================================================================== */
    function useCatPawSkill() {
      if (gameState.score < 30) {
        playSound('devil_pop');
        alert("냥포인트가 부족하다냥! (30 Pt 필요)");
        return;
      }

      gameState.score -= 30;
      playSound('cat_meow');
      setTimeout(() => playSound('purify'), 150);

      // Purify all devils on screen!
      const entities = document.querySelectorAll('.spawn-entity');
      let purifiedCount = 0;

      entities.forEach(el => {
        if (el.classList.contains('devil-aura')) {
          el.innerText = '👼';
          el.className = 'spawn-entity angel-aura text-4xl sm:text-5xl';
          purifiedCount++;
        }
      });

      if (purifiedCount > 0) {
        gameState.angelCount += purifiedCount;
        gameState.devilCount = Math.max(0, gameState.devilCount - purifiedCount);
        gameState.score += purifiedCount * 15;
        confetti({ particleCount: 40, spread: 60, origin: { y: 0.6 } });
        document.getElementById('cat-speech').innerText = `"야옹 펀치로 악마 ${purifiedCount}마리를 모두 정화했다냥! 🐾"`;
      } else {
        document.getElementById('cat-speech').innerText = `"정화할 악마가 없다냥~ 마구 터치해보라냥!"`;
      }

      updateUI();
    }

    function triggerAngelAura() {
      if (gameState.score < 50) {
        playSound('devil_pop');
        alert("냥포인트가 부족하다냥! (50 Pt 필요)");
        return;
      }

      gameState.score -= 50;
      switchRandomAura('angel_blessing');
      auraTimeLeft = 10;
      document.getElementById('cat-speech').innerText = `"10초간 천사 강림 축복이 시작된다냥! 👼"`;
      confetti({ particleCount: 50, spread: 70, origin: { y: 0.5 } });
      updateUI();
    }

    function clearArena() {
      const arena = document.getElementById('touch-arena');
      const entities = arena.querySelectorAll('.spawn-entity');
      entities.forEach(el => el.remove());
      playSound('cat_meow');
      document.getElementById('cat-speech').innerText = `"화면을 깨끗하게 청소했다냥! 다시 터치해라냥~"`;
    }

    function updateUI() {
      document.getElementById('cnt-angel').innerText = gameState.angelCount;
      document.getElementById('cnt-devil').innerText = gameState.devilCount;
      document.getElementById('cnt-score').innerText = gameState.score;
    }

    /* ===================================================================
       5. CANVAS BACKGROUND PARTICLE ENGINE
       =================================================================== */
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function initParticles() {
      particles = [];
      for (let i = 0; i < 25; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2.5 + 1,
          color: ['#38bdf8', '#c084fc', '#facc15', '#ffb7b2'][Math.floor(Math.random() * 4)],
          vx: (Math.random() - 0.5) * 0.5,
          vy: -Math.random() * 0.6 - 0.2,
          alpha: Math.random()
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha += (Math.random() - 0.5) * 0.02;

        if (p.alpha < 0.1) p.alpha = 0.1;
        if (p.alpha > 0.8) p.alpha = 0.8;

        if (p.y < 0) {
          p.y = canvas.height;
          p.x = Math.random() * canvas.width;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.fill();
        ctx.restore();
      });

      requestAnimationFrame(animateParticles);
    }

    /* ===================================================================
       6. GAME INITIALIZATION ON LOAD
       =================================================================== */
    window.onload = function() {
      resizeCanvas();
      initParticles();
      animateParticles();
      startAuraEngine();
    };
  </script>
</body>
</html>
