<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>크런치 슬랑이 - 3D ASMR 촉감 놀이</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js Library for 3D Soft-body Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- FontAwesome Icon Library -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Cute Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Jua', 'Gowun Dodum', sans-serif;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #2a1b4e 0%, #110926 100%);
        }

        /* Glassmorphism Styling */
        .glass-panel {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px) scale(1.03);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .glass-btn:active {
            transform: translateY(2px) scale(0.96);
            background: rgba(255, 255, 255, 0.4);
        }

        .active-mode {
            background: linear-gradient(135deg, #ff007f 0%, #7928ca 100%) !important;
            border-color: #ff99dd !important;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
        }

        /* Sparkle float particle */
        @keyframes sparklePop {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5) rotate(0deg); }
            100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.6) rotate(180deg); }
        }

        .crunch-particle {
            position: absolute;
            pointer-events: none;
            animation: sparklePop 0.6s ease-out forwards;
            font-size: 1.4rem;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
        }

        /* Custom Scrollbar for Topping Toolbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="relative w-full h-full select-none text-white overflow-hidden">

    <!-- 3D Canvas Rendering Container -->
    <div id="canvas-container" class="absolute inset-0 z-0 w-full h-full cursor-grab active:cursor-grabbing"></div>

    <!-- Visual Particles Overlay -->
    <div id="particle-overlay" class="absolute inset-0 z-10 pointer-events-none"></div>

    <!-- Top Header HUD -->
    <div class="absolute top-4 left-0 w-full px-4 z-20 flex justify-between items-center pointer-events-none">
        
        <!-- App Title Badge -->
        <div class="pointer-events-auto glass-panel px-5 py-3 rounded-3xl flex items-center space-x-3 border-pink-400/40">
            <div class="w-11 h-11 bg-gradient-to-tr from-pink-500 to-purple-500 rounded-2xl flex items-center justify-center text-2xl shadow-lg border border-white/50">
                🧪
            </div>
            <div>
                <div class="flex items-center space-x-1.5">
                    <span class="text-[10px] text-pink-300 font-extrabold uppercase tracking-widest">ASMR 촉감 수제 연구소</span>
                    <span id="slime-type-tag" class="bg-purple-500/50 text-pink-200 text-[10px] px-2 py-0.5 rounded-full font-bold border border-pink-300/30">
                        알알이 크런치
                    </span>
                </div>
                <h1 class="text-2xl font-black bg-gradient-to-r from-pink-300 via-purple-200 to-cyan-300 bg-clip-text text-transparent">
                    크런치 슬랑이
                </h1>
            </div>
        </div>

        <!-- HUD Actions: Crunch Counter & Sound Toggle -->
        <div class="pointer-events-auto flex items-center space-x-3">
            <div class="glass-panel px-4 py-2 rounded-2xl flex items-center space-x-2 border-purple-400/30">
                <span class="text-lg">💥</span>
                <div>
                    <div class="text-[9px] text-pink-200 font-bold">바삭 터뜨린 횟수</div>
                    <span id="crunch-count" class="text-base font-black text-amber-300">0 회</span>
                </div>
            </div>

            <!-- Sound Toggle Button -->
            <button id="sound-btn" class="glass-btn w-11 h-11 rounded-2xl flex items-center justify-center text-xl text-pink-300 shadow-lg">
                <i id="sound-icon" class="fa-solid fa-volume-high"></i>
            </button>
        </div>
    </div>

    <!-- Bottom Interactive Control Dock -->
    <div class="absolute bottom-5 left-1/2 transform -translate-x-1/2 z-20 w-full max-w-xl px-4 pointer-events-none">
        <div class="pointer-events-auto glass-panel p-4 rounded-3xl border-2 border-white/20 flex flex-col space-y-3 shadow-2xl backdrop-blur-2xl">
            
            <!-- Slime Header Info & Random Generator Button -->
            <div class="flex justify-between items-center px-1">
                <div class="flex items-center space-x-3">
                    <span id="slime-emoji" class="text-3xl animate-bounce">🍇</span>
                    <div>
                        <span class="text-[10px] text-purple-200 font-bold block">현재 슬랑이 레시피</span>
                        <h2 id="slime-name" class="text-lg font-black text-pink-200">우주 별빛 크런치 슬랑이</h2>
                    </div>
                </div>

                <!-- Random Shape & Texture Generator Button -->
                <button id="random-btn" class="bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 border border-white/50 text-white font-black px-4 py-2.5 rounded-2xl glass-btn flex items-center space-x-2 text-sm shadow-xl hover:brightness-110">
                    <i class="fa-solid fa-dice text-amber-300 animate-spin"></i>
                    <span>🎲 무작위 모양 슬랑이!</span>
                </button>
            </div>

            <hr class="border-white/10">

            <!-- Crunch Topping Selection Toolbar -->
            <div>
                <div class="text-[10px] text-pink-300 font-bold mb-1.5 px-1 flex justify-between">
                    <span>✨ 바삭이 토핑 선택</span>
                    <span id="topping-desc" class="text-purple-200">폼볼 + 비즈 믹스</span>
                </div>
                <div class="grid grid-cols-5 gap-2">
                    <button data-topping="foamballs" class="topping-btn glass-btn py-2 px-1 rounded-xl text-xs flex flex-col items-center border border-white/20 active-mode">
                        <span class="text-base">🔮</span>
                        <span class="text-[10px] font-bold mt-0.5">폼볼</span>
                    </button>
                    <button data-topping="beads" class="topping-btn glass-btn py-2 px-1 rounded-xl text-xs flex flex-col items-center border border-white/20">
                        <span class="text-base">💎</span>
                        <span class="text-[10px] font-bold mt-0.5">크리스탈</span>
                    </button>
                    <button data-topping="cubes" class="topping-btn glass-btn py-2 px-1 rounded-xl text-xs flex flex-col items-center border border-white/20">
                        <span class="text-base">🧊</span>
                        <span class="text-[10px] font-bold mt-0.5">젤리큐브</span>
                    </button>
                    <button data-topping="glitter" class="topping-btn glass-btn py-2 px-1 rounded-xl text-xs flex flex-col items-center border border-white/20">
                        <span class="text-base">✨</span>
                        <span class="text-[10px] font-bold mt-0.5">글리터</span>
                    </button>
                    <button data-topping="boba" class="topping-btn glass-btn py-2 px-1 rounded-xl text-xs flex flex-col items-center border border-white/20">
                        <span class="text-base">🧋</span>
                        <span class="text-[10px] font-bold mt-0.5">버블펄</span>
                    </button>
                </div>
            </div>

            <!-- Texture & Elasticity Presets -->
            <div class="grid grid-cols-3 gap-2 pt-1">
                <button id="preset-crunch" class="preset-btn bg-pink-500/80 text-white font-black py-2 rounded-xl text-xs border border-pink-300 shadow flex items-center justify-center space-x-1">
                    <span>💥 바삭폼 모드</span>
                </button>
                <button id="preset-butter" class="preset-btn bg-white/10 hover:bg-white/20 text-pink-200 font-black py-2 rounded-xl text-xs border border-white/20 shadow flex items-center justify-center space-x-1">
                    <span>🧈 갤럭시 버터</span>
                </button>
                <button id="preset-clear" class="preset-btn bg-white/10 hover:bg-white/20 text-pink-200 font-black py-2 rounded-xl text-xs border border-white/20 shadow flex items-center justify-center space-x-1">
                    <span>💎 슈가 클리어</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Onscreen Touch Guide Overlay -->
    <div id="touch-hint" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none z-10 transition-opacity duration-700 opacity-90">
        <div class="glass-panel px-6 py-3 rounded-full border-2 border-pink-300/50 text-pink-100 font-extrabold text-sm flex items-center space-x-2.5 shadow-2xl animate-pulse">
            <i class="fa-solid fa-hand-sparkles text-xl text-amber-300"></i>
            <span>손가락으로 꾹 누르거나 주~욱 늘려 바삭함을 느껴봐!</span>
        </div>
    </div>

    <script>
        // Real-Time Procedural Web Audio API Sound Synthesizer for Slime ASMR
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Procedural Audio Generators for Micro Crisp Cracks, Squelches, and Pops
        function playCrunchASMR(type = 'poke', intensity = 1.0) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            if (type === 'poke' || type === 'crack') {
                // High frequency micro crunch pops (Form beads crackle)
                const popCount = Math.floor(3 + Math.random() * 5 * intensity);
                for (let i = 0; i < popCount; i++) {
                    const offset = i * (0.015 + Math.random() * 0.02);
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = Math.random() > 0.5 ? 'sine' : 'triangle';
                    const freq = 600 + Math.random() * 1800 * intensity;
                    osc.frequency.setValueAtTime(freq, now + offset);
                    osc.frequency.exponentialRampToValueAtTime(120, now + offset + 0.04);

                    gain.gain.setValueAtTime(0.18 * intensity, now + offset);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.04);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now + offset);
                    osc.stop(now + offset + 0.045);
                }

                // Low squelch base sound
                const baseOsc = audioCtx.createOscillator();
                const baseGain = audioCtx.createGain();
                baseOsc.type = 'sine';
                baseOsc.frequency.setValueAtTime(160, now);
                baseOsc.frequency.exponentialRampToValueAtTime(50, now + 0.12);

                baseGain.gain.setValueAtTime(0.2 * intensity, now);
                baseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                baseOsc.connect(baseGain);
                baseGain.connect(audioCtx.destination);
                baseOsc.start(now);
                baseOsc.stop(now + 0.12);

            } else if (type === 'stretch') {
                // Squeaky elastic wet stretching sound
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                const startFreq = 220 + Math.random() * 100;
                osc.frequency.setValueAtTime(startFreq, now);
                osc.frequency.linearRampToValueAtTime(startFreq + 350 * intensity, now + 0.08);

                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.085);

            } else if (type === 'release') {
                // Satisfying deep crunch snap pop when releasing
                const burstCount = 6;
                for (let i = 0; i < burstCount; i++) {
                    const offset = i * 0.012;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800 + Math.random() * 1200, now + offset);
                    osc.frequency.exponentialRampToValueAtTime(200, now + offset + 0.05);

                    gain.gain.setValueAtTime(0.22, now + offset);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.05);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now + offset);
                    osc.stop(now + offset + 0.055);
                }

            } else if (type === 'morph') {
                // Magical shimmering bubble pop sound when morphing
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.16);
            }
        }

        // Slime Color Palettes & Names
        const SLIME_RECIPES = [
            {
                name: "우주 별빛 크런치 슬랑이",
                emoji: "🌌",
                color: 0x9d4edd,
                roughness: 0.15,
                metalness: 0.2,
                transmission: 0.3,
                clearcoat: 0.8,
                toppings: "foamballs"
            },
            {
                name: "민트 초코 슈가 슬랑이",
                emoji: "🍃",
                color: 0x52b788,
                roughness: 0.25,
                metalness: 0.1,
                transmission: 0.4,
                clearcoat: 0.9,
                toppings: "cubes"
            },
            {
                name: "핑크 자몽 탄산 슬랑이",
                emoji: "🍹",
                color: 0xff4d6d,
                roughness: 0.1,
                metalness: 0.05,
                transmission: 0.6,
                clearcoat: 1.0,
                toppings: "beads"
            },
            {
                name: "황금 꿀타래 크런치 슬랑이",
                emoji: "🍯",
                color: 0xffb703,
                roughness: 0.18,
                metalness: 0.3,
                transmission: 0.5,
                clearcoat: 0.9,
                toppings: "glitter"
            },
            {
                name: "블루베리 타피오카 슬랑이",
                emoji: "🧋",
                color: 0x4361ee,
                roughness: 0.2,
                metalness: 0.15,
                transmission: 0.35,
                clearcoat: 0.85,
                toppings: "boba"
            },
            {
                name: "네온 솜사탕 모찌 슬랑이",
                emoji: "🦄",
                color: 0xff70a6,
                roughness: 0.3,
                metalness: 0.0,
                transmission: 0.2,
                clearcoat: 0.5,
                toppings: "foamballs"
            }
        ];

        let currentRecipeIndex = 0;
        let crunchCount = 0;
        let currentToppingType = 'foamballs';

        // Physics Elasticity Parameters
        let physicsConfig = {
            stiffness: 0.12,
            damping: 0.82,
            deformRadius: 3.2,
            pullStrength: 0.5,
            noiseFreq: 1.2,
            noiseSpeed: 0.0015
        };

        let scene, camera, renderer;
        let slimeGroup, mainMesh, toppingGroup;
        let baseGeometry, originalPositions, currentPositions, velocities;
        let raycaster, mouse, dragPlane, planeIntersect;
        let isDragging = false;
        let grabbedVertexIndices = [];
        let activeSeeds = { seed1: Math.random() * 100, seed2: Math.random() * 100, shapeType: 0 };

        function init3D() {
            const container = document.getElementById('canvas-container');

            // 1. Scene Setup
            scene = new THREE.Scene();

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 9.0);

            // 3. WebGL Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. Lighting for Translucent Slime Gloss
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(6, 10, 8);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const purplePointLight = new THREE.PointLight(0xd8b4fe, 2.0, 20);
            purplePointLight.position.set(-6, -4, 4);
            scene.add(purplePointLight);

            const cyanPointLight = new THREE.PointLight(0x67e8f9, 1.5, 20);
            cyanPointLight.position.set(6, -5, 5);
            scene.add(cyanPointLight);

            // Raycasting & Drag plane
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
            planeIntersect = new THREE.Vector3();

            // Generate First Slime
            generateRandomSlime(SLIME_RECIPES[0]);

            // Register Handlers
            setupEvents();

            // Start Loop
            animate();
        }

        // Non-repetitive Procedural 3D Slime Generator
        function generateRandomSlime(recipe) {
            if (slimeGroup) scene.remove(slimeGroup);

            slimeGroup = new THREE.Group();
            toppingGroup = new THREE.Group();

            // Pick randomized procedural shape rule (0: Organic Multi-Blob, 1: Star Jelly, 2: Torus Donut Slime, 3: Teardrop Drop, 4: Wavy Cloud)
            activeSeeds.shapeType = Math.floor(Math.random() * 5);
            activeSeeds.seed1 = Math.random() * 50;
            activeSeeds.seed2 = Math.random() * 50;

            // Base High-Density Geometry
            if (activeSeeds.shapeType === 2) {
                baseGeometry = new THREE.TorusGeometry(1.6, 0.85, 40, 70);
            } else {
                baseGeometry = new THREE.SphereGeometry(2.0, 56, 56);
            }

            // Apply Mathematical Noise Deformation to Vertices so it never repeats strangely
            const posAttr = baseGeometry.attributes.position;
            const vCount = posAttr.count;

            for (let i = 0; i < vCount; i++) {
                let x = posAttr.getX(i);
                let y = posAttr.getY(i);
                let z = posAttr.getZ(i);

                const radius = Math.hypot(x, y, z);
                const angle1 = Math.atan2(y, x);
                const angle2 = Math.acos(z / (radius || 1));

                let displacement = 0;

                if (activeSeeds.shapeType === 0) {
                    // Multi-Blob Fluid Bulges
                    displacement = Math.sin(angle1 * 3 + activeSeeds.seed1) * 0.35 + Math.cos(angle2 * 4 + activeSeeds.seed2) * 0.25;
                } else if (activeSeeds.shapeType === 1) {
                    // Star Jelly Slime
                    displacement = Math.sin(angle1 * 5) * 0.45 * Math.sin(angle2 * 3);
                } else if (activeSeeds.shapeType === 3) {
                    // Teardrop Fluid Splash
                    displacement = (y > 0 ? y * 0.25 : -y * 0.15) + Math.sin(angle1 * 4) * 0.2;
                } else if (activeSeeds.shapeType === 4) {
                    // Wavy Cloud Puff
                    displacement = Math.cos(x * 1.8 + activeSeeds.seed1) * 0.3 + Math.sin(z * 1.8 + activeSeeds.seed2) * 0.3;
                }

                const factor = 1 + displacement * 0.3;
                posAttr.setXYZ(i, x * factor, y * factor, z * factor);
            }

            baseGeometry.computeVertexNormals();

            // Material Setup
            const slimeMat = new THREE.MeshPhysicalMaterial({
                color: recipe.color,
                roughness: recipe.roughness,
                metalness: recipe.metalness,
                transmission: recipe.transmission,
                opacity: 0.95,
                transparent: true,
                clearcoat: recipe.clearcoat,
                clearcoatRoughness: 0.1,
                ior: 1.4,
                reflectivity: 0.8
            });

            mainMesh = new THREE.Mesh(baseGeometry, slimeMat);
            mainMesh.castShadow = true;
            mainMesh.receiveShadow = true;
            slimeGroup.add(mainMesh);

            // Prepare Deformation Arrays
            originalPositions = new Float32Array(vCount * 3);
            currentPositions = new Float32Array(vCount * 3);
            velocities = new Float32Array(vCount * 3);

            for (let i = 0; i < vCount * 3; i++) {
                originalPositions[i] = posAttr.array[i];
                currentPositions[i] = posAttr.array[i];
                velocities[i] = 0;
            }

            // Scatter Embedded 3D Crunch Toppings across surface
            spawnCrunchToppings(currentToppingType, recipe.color);

            slimeGroup.add(toppingGroup);
            scene.add(slimeGroup);

            // Update UI Labels
            document.getElementById('slime-name').innerText = recipe.name;
            document.getElementById('slime-emoji').innerText = recipe.emoji;
        }

        // Spawn Embedded 3D Crunch Topping Beads / Cubes / Glitters
        function spawnCrunchToppings(toppingType, baseColorHex) {
            // Clear existing toppings
            while (toppingGroup.children.length > 0) {
                const obj = toppingGroup.children[0];
                toppingGroup.remove(obj);
            }

            const toppingCount = toppingType === 'glitter' ? 220 : 130;
            const posAttr = baseGeometry.attributes.position;
            const vCount = posAttr.count;

            for (let i = 0; i < toppingCount; i++) {
                const targetVIdx = Math.floor(Math.random() * vCount);
                const vx = posAttr.getX(targetVIdx);
                const vy = posAttr.getY(targetVIdx);
                const vz = posAttr.getZ(targetVIdx);

                let toppingGeo, toppingMat;

                if (toppingType === 'foamballs') {
                    // White & Pastel Crunchy Foam Balls
                    toppingGeo = new THREE.SphereGeometry(0.12 + Math.random() * 0.08, 12, 12);
                    const colors = [0xffffff, 0xffe5ec, 0xe0f2fe, 0xf3e8ff];
                    toppingMat = new THREE.MeshStandardMaterial({
                        color: colors[Math.floor(Math.random() * colors.length)],
                        roughness: 0.8
                    });

                } else if (toppingType === 'beads') {
                    // Transparent Clear Fishbowl Glass Beads
                    toppingGeo = new THREE.SphereGeometry(0.14, 12, 12);
                    toppingMat = new THREE.MeshPhysicalMaterial({
                        color: 0xffffff,
                        transmission: 0.9,
                        opacity: 0.9,
                        transparent: true,
                        roughness: 0.1
                    });

                } else if (toppingType === 'cubes') {
                    // Translucent Jelly Cubes
                    toppingGeo = new THREE.BoxGeometry(0.22, 0.22, 0.22);
                    toppingMat = new THREE.MeshPhysicalMaterial({
                        color: baseColorHex,
                        transmission: 0.7,
                        opacity: 0.85,
                        transparent: true,
                        roughness: 0.2
                    });

                } else if (toppingType === 'glitter') {
                    // Shiny Metallic Sequins
                    toppingGeo = new THREE.TetrahedronGeometry(0.08);
                    toppingMat = new THREE.MeshStandardMaterial({
                        color: 0xffd700,
                        metalness: 0.95,
                        roughness: 0.1
                    });

                } else if (toppingType === 'boba') {
                    // Black Glossy Boba Pearls
                    toppingGeo = new THREE.SphereGeometry(0.18, 14, 14);
                    toppingMat = new THREE.MeshStandardMaterial({
                        color: 0x111111,
                        roughness: 0.15,
                        metalness: 0.1
                    });
                }

                const mesh = new THREE.Mesh(toppingGeo, toppingMat);

                // Embed slightly inside/outside mesh surface
                const offsetFactor = 0.9 + Math.random() * 0.18;
                mesh.position.set(vx * offsetFactor, vy * offsetFactor, vz * offsetFactor);
                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);

                // Store target vertex index for realtime physics anchoring
                mesh.userData = { vertexIndex: targetVIdx, offsetFactor: offsetFactor };
                toppingGroup.add(mesh);
            }
        }

        function setupEvents() {
            const container = document.getElementById('canvas-container');

            function getPointerPos(e) {
                if (e.touches && e.touches.length > 0) {
                    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
                return { x: e.clientX, y: e.clientY };
            }

            function onPointerDown(e) {
                const pos = getPointerPos(e);

                const hint = document.getElementById('touch-hint');
                if (hint) hint.style.opacity = '0';

                mouse.x = (pos.x / window.innerWidth) * 2 - 1;
                mouse.y = -(pos.y / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(mainMesh);

                if (intersects.length > 0) {
                    isDragging = true;
                    const hitPoint = intersects[0].point;

                    dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(dragPlane.normal).negate(), hitPoint);

                    const posAttr = baseGeometry.attributes.position;
                    const localHit = mainMesh.worldToLocal(hitPoint.clone());
                    grabbedVertexIndices = [];

                    for (let i = 0; i < posAttr.count; i++) {
                        const vx = posAttr.getX(i);
                        const vy = posAttr.getY(i);
                        const vz = posAttr.getZ(i);
                        const dist = Math.hypot(vx - localHit.x, vy - localHit.y, vz - localHit.z);

                        if (dist < physicsConfig.deformRadius) {
                            grabbedVertexIndices.push({ index: i, weight: 1 - (dist / physicsConfig.deformRadius) });
                        }
                    }

                    // Play Sound & Increment Counter
                    playCrunchASMR('poke', 1.2);
                    spawnVisualParticles(pos.x, pos.y);

                    crunchCount += Math.floor(3 + Math.random() * 4);
                    document.getElementById('crunch-count').innerText = `${crunchCount} 회`;
                }
            }

            function onPointerMove(e) {
                if (!isDragging || grabbedVertexIndices.length === 0) return;

                const pos = getPointerPos(e);
                mouse.x = (pos.x / window.innerWidth) * 2 - 1;
                mouse.y = -(pos.y / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                raycaster.ray.intersectPlane(dragPlane, planeIntersect);

                const localPlaneIntersect = mainMesh.worldToLocal(planeIntersect.clone());

                // Apply vertex pull deformation
                grabbedVertexIndices.forEach(item => {
                    const idx = item.index;
                    const w = item.weight * physicsConfig.pullStrength;

                    const i3 = idx * 3;
                    const targetX = THREE.MathUtils.lerp(originalPositions[i3], localPlaneIntersect.x, w);
                    const targetY = THREE.MathUtils.lerp(originalPositions[i3 + 1], localPlaneIntersect.y, w);
                    const targetZ = THREE.MathUtils.lerp(originalPositions[i3 + 2], localPlaneIntersect.z, w);

                    velocities[i3] += (targetX - currentPositions[i3]) * 0.45;
                    velocities[i3 + 1] += (targetY - currentPositions[i3 + 1]) * 0.45;
                    velocities[i3 + 2] += (targetZ - currentPositions[i3 + 2]) * 0.45;
                });

                if (Math.random() < 0.35) {
                    playCrunchASMR('stretch', 0.9);
                    spawnVisualParticles(pos.x, pos.y);
                }
            }

            function onPointerUp() {
                if (isDragging) {
                    isDragging = false;
                    grabbedVertexIndices = [];
                    playCrunchASMR('release', 1.2);
                }
            }

            // Mouse & Touch Listeners
            container.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            container.addEventListener('touchstart', onPointerDown, { passive: false });
            window.addEventListener('touchmove', onPointerMove, { passive: false });
            window.addEventListener('touchend', onPointerUp);

            // UI Button Events
            document.getElementById('random-btn').addEventListener('click', () => {
                currentRecipeIndex = (currentRecipeIndex + 1) % SLIME_RECIPES.length;
                generateRandomSlime(SLIME_RECIPES[currentRecipeIndex]);
                playCrunchASMR('morph');
            });

            // Topping Toolbar Events
            document.querySelectorAll('.topping-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.topping-btn').forEach(b => b.classList.remove('active-mode'));
                    const targetBtn = e.currentTarget;
                    targetBtn.classList.add('active-mode');

                    currentToppingType = targetBtn.getAttribute('data-topping');
                    const descriptions = {
                        foamballs: '알알이 폼볼 마이크로 크런치',
                        beads: '투명 크리스탈 비즈 찰랑임',
                        cubes: '탱글 젤리 큐브 쫀득함',
                        glitter: '영롱 글리터 골드 반짝이',
                        boba: '쫄깃 버블 타피오카 펄'
                    };
                    document.getElementById('topping-desc').innerText = descriptions[currentToppingType];

                    spawnCrunchToppings(currentToppingType, SLIME_RECIPES[currentRecipeIndex].color);
                    playCrunchASMR('poke', 1.0);
                });
            });

            // Preset Elasticity Buttons
            document.getElementById('preset-crunch').addEventListener('click', () => {
                physicsConfig.stiffness = 0.16;
                physicsConfig.damping = 0.78;
                document.getElementById('slime-type-tag').innerText = '알알이 바삭폼';
                playCrunchASMR('poke');
            });

            document.getElementById('preset-butter').addEventListener('click', () => {
                physicsConfig.stiffness = 0.08;
                physicsConfig.damping = 0.85;
                document.getElementById('slime-type-tag').innerText = '부드러운 버터';
                playCrunchASMR('stretch');
            });

            document.getElementById('preset-clear').addEventListener('click', () => {
                physicsConfig.stiffness = 0.22;
                physicsConfig.damping = 0.88;
                document.getElementById('slime-type-tag').innerText = '탱글 슈가 클리어';
                playCrunchASMR('release');
            });

            // Sound Mute Toggle
            document.getElementById('sound-btn').addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                const icon = document.getElementById('sound-icon');
                if (soundEnabled) {
                    icon.className = 'fa-solid fa-volume-high';
                } else {
                    icon.className = 'fa-solid fa-volume-xmark text-gray-400';
                }
            });

            window.addEventListener('resize', onWindowResize);
        }

        function spawnVisualParticles(x, y) {
            const overlay = document.getElementById('particle-overlay');
            const icons = ['💥', '✨', '🔮', '💎', '⭐', '🌸'];

            for (let i = 0; i < 3; i++) {
                const p = document.createElement('div');
                p.className = 'crunch-particle';
                p.innerText = icons[Math.floor(Math.random() * icons.length)];
                p.style.left = `${x}px`;
                p.style.top = `${y}px`;

                const dx = (Math.random() - 0.5) * 110;
                const dy = (Math.random() - 0.5) * 110 - 30;
                p.style.setProperty('--dx', `${dx}px`);
                p.style.setProperty('--dy', `${dy}px`);

                overlay.appendChild(p);
                setTimeout(() => p.remove(), 600);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Update Spring Soft-Body Vertex Simulation
            if (baseGeometry && mainMesh) {
                const posAttr = baseGeometry.attributes.position;
                const vCount = posAttr.count;
                const time = Date.now() * physicsConfig.noiseSpeed;

                for (let i = 0; i < vCount; i++) {
                    const i3 = i * 3;

                    // Organic non-repetitive micro wave ripple force
                    const waveX = Math.sin(time + originalPositions[i3 + 1] * 1.5) * 0.012;
                    const waveY = Math.cos(time + originalPositions[i3] * 1.5) * 0.012;

                    // Spring restoration
                    const forceX = (originalPositions[i3] - currentPositions[i3]) * physicsConfig.stiffness + waveX;
                    const forceY = (originalPositions[i3 + 1] - currentPositions[i3 + 1]) * physicsConfig.stiffness + waveY;
                    const forceZ = (originalPositions[i3 + 2] - currentPositions[i3 + 2]) * physicsConfig.stiffness;

                    velocities[i3] = (velocities[i3] + forceX) * physicsConfig.damping;
                    velocities[i3 + 1] = (velocities[i3 + 1] + forceY) * physicsConfig.damping;
                    velocities[i3 + 2] = (velocities[i3 + 2] + forceZ) * physicsConfig.damping;

                    currentPositions[i3] += velocities[i3];
                    currentPositions[i3 + 1] += velocities[i3 + 1];
                    currentPositions[i3 + 2] += velocities[i3 + 2];

                    posAttr.setXYZ(i, currentPositions[i3], currentPositions[i3 + 1], currentPositions[i3 + 2]);
                }

                posAttr.needsUpdate = true;
                baseGeometry.computeVertexNormals();

                // Synchronize Topping Positions with Deformed Slime Vertices
                toppingGroup.children.forEach(child => {
                    if (child.userData && child.userData.vertexIndex !== undefined) {
                        const vIdx = child.userData.vertexIndex;
                        const factor = child.userData.offsetFactor;

                        const vx = currentPositions[vIdx * 3];
                        const vy = currentPositions[vIdx * 3 + 1];
                        const vz = currentPositions[vIdx * 3 + 2];

                        child.position.set(vx * factor, vy * factor, vz * factor);
                    }
                });
            }

            // Subtle Idle Floating Motion
            if (slimeGroup && !isDragging) {
                slimeGroup.rotation.y = Math.sin(Date.now() * 0.0008) * 0.12;
                slimeGroup.rotation.x = Math.cos(Date.now() * 0.0006) * 0.08;
            }

            renderer.render(scene, camera);
        }

        // Initialize App on Window Load
        window.onload = function() {
            init3D();
        };
    </script>
</body>
</html>
