<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>얍! 변신앱 - 책 속 고양이의 신비한 마법</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            jua: ['"Jua"', 'sans-serif'],
            gaegu: ['"Gaegu"', 'cursive']
          },
          animation: {
            'bounce-slow': 'bounce 2s infinite',
            'wiggle': 'wiggle 0.5s ease-in-out infinite',
            'float': 'float 3s ease-in-out infinite',
            'pulse-glow': 'pulseGlow 1.5s infinite alternate'
          },
          keyframes: {
            wiggle: {
              '0%, 100%': { transform: 'rotate(-6deg)' },
              '50%': { transform: 'rotate(6deg)' }
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' }
            },
            pulseGlow: {
              '0%': { filter: 'drop-shadow(0 0 10px rgba(236,72,153,0.4))' },
              '100%': { filter: 'drop-shadow(0 0 25px rgba(245,158,11,0.8))' }
            }
          }
        }
      }
    }
  </script>

  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      font-family: 'Jua', sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #311b92 40%, #4a148c 100%);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }
    .transform-active {
      animation: popTransform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popTransform {
      0% { transform: scale(0.3) rotate(-20deg); opacity: 0; }
      50% { transform: scale(1.25) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .star-bg {
      background-image: radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 90px 40px, #ddd, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
    }
  </style>
</head>
<body class="star-bg min-h-screen flex flex-col items-center justify-between p-4 relative">

  <!-- HEADER SECTION -->
  <header class="w-full max-w-md pt-4 text-center z-10">
    <div class="inline-flex items-center space-x-2 bg-purple-900/60 border border-purple-400/40 px-4 py-1.5 rounded-full shadow-lg mb-2">
      <span class="animate-spin text-yellow-300">✨</span>
      <span class="text-xs text-purple-200 tracking-wider">책 속 주인공 고양이의 마법 주문</span>
    </div>
    <h1 class="text-4xl sm:text-5xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-pink-400 to-cyan-300 drop-shadow-md">
      얍! 변신앱 🔮
    </h1>
  </header>

  <!-- MAIN CHARACTER CONTAINER -->
  <main class="w-full max-w-md my-auto flex flex-col items-center z-10 space-y-5">
    
    <!-- Speech Bubble -->
    <div class="relative max-w-[85%] bg-white text-slate-800 px-5 py-3 rounded-2xl shadow-xl border-2 border-amber-300 text-center animate-float">
      <p id="speech-bubble" class="font-gaegu text-xl font-bold leading-snug">
        "야옹! 내가 바로 책 속 주인공 고양이다냥! 얍 버튼을 눌러보라냥!"
      </p>
      <!-- Pointer Triangle -->
      <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-t-[12px] border-t-white"></div>
    </div>

    <!-- Transformation Card -->
    <div id="character-card" class="glass-card w-full rounded-3xl p-6 flex flex-col items-center justify-center shadow-2xl relative overflow-hidden transition-all duration-300">
      
      <!-- Species Badge & Rarity -->
      <div class="w-full flex justify-between items-center mb-2">
        <span id="species-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-pink-500/80 text-white shadow">
          🐱 고양이 형태
        </span>
        <span id="rarity-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-amber-400 text-slate-900 shadow">
          ⭐ 일반
        </span>
      </div>

      <!-- Character Emoji Visual -->
      <div class="relative my-4 flex items-center justify-center h-44 w-44">
        <div id="glow-aura" class="absolute inset-0 bg-amber-400/20 rounded-full blur-2xl animate-pulse-glow"></div>
        <div id="character-avatar" class="text-8xl sm:text-9xl filter drop-shadow-2xl transition-transform duration-300 transform hover:scale-110 cursor-pointer" onclick="touchCharacter()">
          🐱
        </div>
      </div>

      <!-- Character Name & Description -->
      <div class="text-center mt-2">
        <h2 id="character-name" class="text-3xl font-black text-amber-300 tracking-wide drop-shadow">
          책 속 주인공 냥이
        </h2>
        <p id="character-desc" class="text-xs text-purple-200 mt-1 font-gaegu text-lg">
          호기심이 많고 마법 서적을 읽는 것을 좋아하는 별난 고양이.
        </p>
      </div>

      <!-- Stats Bar -->
      <div class="w-full grid grid-cols-2 gap-2 mt-4 pt-3 border-t border-white/10 text-xs">
        <div class="bg-black/30 p-2.5 rounded-xl flex items-center justify-between">
          <span class="text-purple-300">💖 귀여움</span>
          <span id="stat-cute" class="font-bold text-pink-300">999+</span>
        </div>
        <div class="bg-black/30 p-2.5 rounded-xl flex items-center justify-between">
          <span class="text-purple-300">⚡ 멍냥에너지</span>
          <span id="stat-energy" class="font-bold text-amber-300">85%</span>
        </div>
      </div>
    </div>

    <!-- Dynamic Chaos Probability Indicator -->
    <div class="w-full bg-purple-950/60 border border-purple-500/30 rounded-2xl p-3 flex justify-between items-center text-xs">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-dice-d20 text-pink-400 text-base animate-spin" style="animation-duration: 6s;"></i>
        <span class="text-purple-200">실시간 변신 무작위율:</span>
      </div>
      <span id="chaos-meter" class="font-bold text-cyan-300 bg-cyan-950/80 px-2.5 py-1 rounded-lg border border-cyan-500/30">
        냥 50% : 댕 50%
      </span>
    </div>

    <!-- TRANSFORM BUTTON -->
    <button 
      id="btn-transform"
      onclick="triggerTransformation()" 
      class="w-full py-4 rounded-2xl bg-gradient-to-r from-amber-400 via-pink-500 to-purple-600 text-white font-black text-2xl shadow-xl shadow-pink-500/40 hover:brightness-110 active:scale-95 transition-all flex items-center justify-center space-x-3 border-2 border-amber-200 group relative overflow-hidden"
    >
      <span class="text-3xl group-hover:rotate-12 transition-transform">🔮</span>
      <span class="tracking-wider">얍! 변신해라 얍!</span>
      <span class="text-2xl group-hover:-rotate-12 transition-transform">✨</span>
    </button>
  </main>

  <!-- FOOTER & DEX COUNTER -->
  <footer class="w-full max-w-md pb-4 z-10">
    <div class="glass-card rounded-2xl p-3 flex justify-around items-center text-center text-xs">
      <div>
        <div class="text-purple-300">발견한 고양이</div>
        <div id="dex-cats" class="text-lg font-bold text-pink-400">1 / 5</div>
      </div>
      <div class="w-px h-8 bg-white/10"></div>
      <div>
        <div class="text-purple-300">총 변신 횟수</div>
        <div id="total-transforms" class="text-lg font-bold text-amber-300">0회</div>
      </div>
      <div class="w-px h-8 bg-white/10"></div>
      <div>
        <div class="text-purple-300">발견한 강아지</div>
        <div id="dex-dogs" class="text-lg font-bold text-cyan-400">0 / 5</div>
      </div>
    </div>
  </footer>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    /* ===================================================================
       1. WEB AUDIO SYNTHESIZER (Meows, Barks & Magic Chimes)
       =================================================================== */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'meow') {
          // Cute pitch-bent synth meow
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(550, now);
          osc.frequency.exponentialRampToValueAtTime(850, now + 0.15);
          osc.frequency.exponentialRampToValueAtTime(400, now + 0.35);

          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'bark') {
          // Energetic dog bark sound
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(110, now + 0.12);

          gain.gain.setValueAtTime(0.6, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'magic') {
          // Shiny sparkle transform chime
          for (let i = 0; i < 5; i++) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600 + i * 250, now + i * 0.05);

            gain.gain.setValueAtTime(0.2, now + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.2);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + i * 0.05);
            osc.stop(now + i * 0.05 + 0.2);
          }
        }
      } catch (e) {}
    }

    /* ===================================================================
       2. TRANSFORM DATABASE (Unpredictable Forms)
       =================================================================== */
    const CAT_FORMS = [
      {
        name: "책 속 주인공 냥이",
        emoji: "🐱",
        badge: "🐱 고양이",
        rarity: "⭐ 기본",
        desc: "호기심이 많고 마법 서적을 읽는 별난 주인공 고양이!",
        dialogue: "야옹! 다시 내 원래 모습으로 돌아왔다냥! 역시 편안해냥!",
        badgeBg: "bg-pink-500/80"
      },
      {
        name: "치즈 식빵 고양이",
        emoji: "🍞",
        badge: "🐱 고양이",
        rarity: "⭐⭐ 희귀",
        desc: "따끈따끈하게 노릇노릇 구워진 고소한 치즈 식빵 냥이.",
        dialogue: "야옹~ 굽기가 딱 적당하다냥! 바삭바삭하다냥!",
        badgeBg: "bg-amber-500/80"
      },
      {
        name: "우주 탐험 마법냥",
        emoji: "😸",
        badge: "🐱 고양이",
        rarity: "⭐⭐⭐ 전설",
        desc: "은하수를 건너 마법을 연구하는 신비로운 우주 고양이.",
        dialogue: "야옹! 우주의 마력 에너지가 차오른다냥! 🌌",
        badgeBg: "bg-indigo-500/80"
      },
      {
        name: "검은 고양이 마법사",
        emoji: "🐈‍⬛",
        badge: "🐱 고양이",
        rarity: "⭐⭐ 희귀",
        desc: "달빛 아래서 비밀 주문을 외우는 밤의 지배자.",
        dialogue: "야옹~ 어둠 속에서 더 선명하게 보인다냥! 🌙",
        badgeBg: "bg-purple-600/80"
      },
      {
        name: "무지개 여신 냥이",
        emoji: "😻",
        badge: "🐱 고양이",
        rarity: "🌟 신화",
        desc: "황금빛과 무지개 기운을 품은 최강 귀요미 고양이!",
        dialogue: "야옹✨ 행운의 무지개 기운을 너에게 전달한다냥!",
        badgeBg: "bg-gradient-to-r from-pink-500 to-yellow-400"
      }
    ];

    const DOG_FORMS = [
      {
        name: "시끌벅적 시바견",
        emoji: "🐕",
        badge: "🐶 강아지",
        rarity: "⭐ 일반",
        desc: "볼살이 쫀득쫀득하고 꼬리를 세차게 흔드는 강아지!",
        dialogue: "멍멍! 헐?! 내가 강아지가 됐다니?! 기분은 좋다 멍!",
        badgeBg: "bg-cyan-500/80"
      },
      {
        name: "우주복 장착 댕댕이",
        emoji: "🐶",
        badge: "🐶 강아지",
        rarity: "⭐⭐ 희귀",
        desc: "산책이라면 무중력 우주공간도 마다하지 않는 댕댕이.",
        dialogue: "멍멍! 우주 산책 가자 멍! 꼬리 프로펠러 가동!",
        badgeBg: "bg-blue-500/80"
      },
      {
        name: "식탐왕 불독",
        emoji: "🐩",
        badge: "🐶 강아지",
        rarity: "⭐⭐ 희귀",
        desc: "맛있는 뼈다귀 향기를 맡으면 누구보다 빠른 강아지.",
        dialogue: "멍! 어디서 맛있는 냄새가 나는데 멍?!",
        badgeBg: "bg-teal-500/80"
      },
      {
        name: "늑대 영혼 댕댕이",
        emoji: "🐺",
        badge: "🐶 강아지",
        rarity: "⭐⭐⭐ 전설",
        desc: "용맹한 늑대의 피가 흐르는 멋쟁이 보스 강아지.",
        dialogue: "아우우우~! 달을 향해 짖어라 멍!",
        badgeBg: "bg-slate-600/80"
      },
      {
        name: "황금 뼈다귀 기사 댕댕",
        emoji: "🦮",
        badge: "🐶 강아지",
        rarity: "🌟 신화",
        desc: "전설의 황금 뼈다귀를 지키는 명예로운 강아지 기사.",
        dialogue: "멍멍!! 정의의 이름으로 세상을 지키겠다 멍!",
        badgeBg: "bg-gradient-to-r from-amber-400 to-orange-500"
      }
    ];

    /* ===================================================================
       3. GAME STATE & UNPREDICTABLE RANDOM PROBABILITY ENGINE
       =================================================================== */
    let totalTransforms = 0;
    let unlockedCats = new Set([0]);
    let unlockedDogs = new Set();
    
    // Dynamic Ratio Generator (Never boring static 50/50!)
    let currentCatRatio = 50; 
    let currentDogRatio = 50;

    function updateChaosRatio() {
      // Unpredictable shifting probability per click or session
      // Chaos formula based on transform count, current second, and random fluctuations
      const now = new Date().getTime();
      const flexFactor = Math.sin(now / 1000) * 35; // Oscillation -35% to +35%
      
      currentCatRatio = Math.max(10, Math.min(90, Math.round(50 + flexFactor)));
      currentDogRatio = 100 - currentCatRatio;

      document.getElementById('chaos-meter').innerText = 
        `냥 ${currentCatRatio}% : 댕 ${currentDogRatio}%`;
    }

    function triggerTransformation() {
      playSound('magic');
      totalTransforms++;

      // 1. Calculate dynamic probability
      updateChaosRatio();

      const roll = Math.random() * 100;
      const isCat = roll < currentCatRatio;

      // 2. Select form based on rarity weighted probability
      let selectedForm;
      if (isCat) {
        const catIdx = getRandomFormIndex(CAT_FORMS.length);
        selectedForm = CAT_FORMS[catIdx];
        unlockedCats.add(catIdx);
        setTimeout(() => playSound('meow'), 200);
      } else {
        const dogIdx = getRandomFormIndex(DOG_FORMS.length);
        selectedForm = DOG_FORMS[dogIdx];
        unlockedDogs.add(dogIdx);
        setTimeout(() => playSound('bark'), 200);
      }

      // 3. Trigger visual effects
      renderTransformation(selectedForm, isCat);

      // Confetti for Rare & Mythic forms!
      if (selectedForm.rarity.includes("전설") || selectedForm.rarity.includes("신화")) {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    function getRandomFormIndex(max) {
      // Weighted randomness: 0 (common) is most frequent, rare forms need luck!
      const rand = Math.random();
      if (rand < 0.45) return 0; // Common
      if (rand < 0.75) return 1; // Uncommon
      if (rand < 0.90) return 2; // Rare
      if (rand < 0.98) return 3; // Legendary
      return 4; // Mythic (2% chance)
    }

    /* ===================================================================
       4. UI RENDERER & INTERACTION
       =================================================================== */
    function renderTransformation(form, isCat) {
      const card = document.getElementById('character-card');
      const avatar = document.getElementById('character-avatar');

      // Pop Animation
      avatar.classList.remove('transform-active');
      void avatar.offsetWidth; // Trigger reflow
      avatar.classList.add('transform-active');

      // Update Text Content
      document.getElementById('speech-bubble').innerText = `"${form.dialogue}"`;
      document.getElementById('character-name').innerText = form.name;
      document.getElementById('character-desc').innerText = form.desc;
      avatar.innerText = form.emoji;

      // Update Badges
      const speciesBadge = document.getElementById('species-badge');
      speciesBadge.innerText = form.badge;
      speciesBadge.className = `px-3 py-1 rounded-full text-xs font-bold text-white shadow ${form.badgeBg}`;

      document.getElementById('rarity-badge').innerText = form.rarity;

      // Update Dynamic Stats
      document.getElementById('stat-cute').innerText = Math.floor(Math.random() * 500 + 500) + '♥';
      document.getElementById('stat-energy').innerText = Math.floor(Math.random() * 40 + 60) + '%';

      // Update Dex Footer
      document.getElementById('dex-cats').innerText = `${unlockedCats.size} / ${CAT_FORMS.length}`;
      document.getElementById('dex-dogs').innerText = `${unlockedDogs.size} / ${DOG_FORMS.length}`;
      document.getElementById('total-transforms').innerText = `${totalTransforms}회`;
    }

    function touchCharacter() {
      // Interactive touch/click reaction on avatar
      const species = document.getElementById('species-badge').innerText;
      if (species.includes('고양이')) {
        playSound('meow');
      } else {
        playSound('bark');
      }

      const avatar = document.getElementById('character-avatar');
      avatar.classList.add('animate-wiggle');
      setTimeout(() => avatar.classList.remove('animate-wiggle'), 500);
    }

    // Initialize on page load
    window.onload = function() {
      updateChaosRatio();
    };
  </script>
</body>
</html>
